# Dependabot config — RBAC-P1-001 (#640).
# Mitigates risk R-26 (stack drift) per CLAUDE.md §"Zarządzanie zależnościami":
#   - Renovate / Dependabot z automerge tylko patch, manual review minor/major.
#
# Schedule: daily for security-sensitive ecosystems, weekly for stable ones.
# Each PR carries `dependencies` label so the bulk maintenance ticket
# (CLAUDE.md "Maintenance ticket co 2 epiki") can grep recent PRs.
version: 2

updates:
  # ────────────────────────────────────────────────────────────────
  # GitHub Actions — CI/CD workflow definitions
  # ────────────────────────────────────────────────────────────────
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Warsaw
    open-pull-requests-limit: 2
    # Fan-out control (CI minutes audit 2026-08-06): 20 separate bot branches
    # in 7 days x 4 workflows = 342 CI min/day. Grouping patch+minor into one
    # PR per ecosystem validates the same code with the same full matrix, just
    # in one batch. Majors stay excluded (see `ignore:` below) and keep landing
    # as individual PRs for manual review per the dependency policy.
    groups:
      github-actions:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: "ci"
      include: scope

  # ────────────────────────────────────────────────────────────────
  # Composer — PHP backend (apps/api/)
  # ────────────────────────────────────────────────────────────────
  - package-ecosystem: composer
    directory: /apps/api
    schedule:
      # Weekly to avoid first-run backlog flood. Patch updates are
      # frequent enough that weekly catches them within the
      # CLAUDE.md "Maintenance ticket co 2 epiki" cadence.
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Warsaw
    open-pull-requests-limit: 3
    groups:
      composer-patch-minor:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    labels:
      - dependencies
      - backend
    commit-message:
      prefix: "chore(deps)"
      include: scope
    # Manual review for major bumps per CLAUDE.md §"Zarządzanie zależnościami":
    # "Po każdym major bump pakietu generującego kod (np. API Platform, Doctrine)
    # — pełen composer dump-autoload + regeneracja DTO/types + naprawa breaking
    # changes zanim ticket = done."
    ignore:
      - dependency-name: "api-platform/*"
        update-types:
          - version-update:semver-major
      - dependency-name: "doctrine/*"
        update-types:
          - version-update:semver-major
      - dependency-name: "symfony/*"
        update-types:
          - version-update:semver-major

  # ────────────────────────────────────────────────────────────────
  # npm — whole pnpm workspace (root + apps/admin + packages/*)
  #
  # NOTE (2026-07-02): there used to be a second npm entry with
  # directory: /apps/admin. It was removed on purpose — dependabot
  # bumped apps/admin/package.json WITHOUT regenerating the
  # workspace-root pnpm-lock.yaml, so every PR from that entry
  # (grouped or not) failed CI with ERR_PNPM_OUTDATED_LOCKFILE and
  # had to be redone manually. This root entry covers the entire
  # pnpm workspace correctly (manifest + lockfile together).
  # Do not re-add a per-directory npm entry.
  # ────────────────────────────────────────────────────────────────
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Warsaw
    open-pull-requests-limit: 3
    groups:
      npm-patch-minor:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    labels:
      - dependencies
      - tooling
    commit-message:
      prefix: "chore(deps)"
      include: scope
    ignore:
      - dependency-name: "react"
        update-types:
          - version-update:semver-major
      - dependency-name: "react-dom"
        update-types:
          - version-update:semver-major
      - dependency-name: "@refinedev/*"
        update-types:
          - version-update:semver-major
      - dependency-name: "vite"
        update-types:
          - version-update:semver-major
