name: Security audit

# composer audit + pnpm audit on every PR + nightly on main.
# Blocks merge on moderate/high/critical CVEs (failed audit returns non-zero).
#
# #2148 — composer + pnpm audit share one job (was two) so a single PR
# run stays under the GitHub Free 20-concurrent-job cap. Both audits run
# sequentially; each still fails the job independently.

on:
  # No push:main — the same commit was audited on the PR minutes earlier and a
  # squash changes the SHA, not composer.lock/pnpm-lock.yaml. Freshly published
  # CVEs in UNCHANGED dependencies are what the nightly cron is for (it caught
  # 5 real failures in the measured week).
  pull_request:
  schedule:
    - cron: "17 3 * * *"

concurrency:
  group: audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-audit:
    name: Dependency audit (composer + pnpm)
    runs-on: ubuntu-latest
    # #2949 — mierzone: ~30 s (composer + pnpm audit). Bez limitu obowiazuje domyslne 6 h GitHuba.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: ctype, iconv, intl
          tools: composer:v2

      - name: composer audit
        working-directory: apps/api
        run: composer audit --no-dev --abandoned=fail --locked

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Reject hidden pnpm audit exceptions
        run: |
          node -e "const p = require('./package.json'); const ignored = p.pnpm?.auditConfig?.ignoreGhsas ?? []; if (ignored.length) throw new Error('pnpm audit exceptions are forbidden: ' + ignored.join(', '))"

      - name: pnpm audit
        run: pnpm audit --audit-level=moderate
