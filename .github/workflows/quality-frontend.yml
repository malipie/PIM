name: Quality (Frontend)

# Runs on every PR + push to main. Branch protection on main requires this to pass.

on:
  pull_request:
    paths:
      - "apps/admin/**"
      # Playwright runs the full stack — any backend / infra change can break the E2E happy path.
      - "apps/api/**"
      - "docker-compose.yml"
      - "docker/**"
      - "packages/**"
      - "biome.json"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "turbo.json"
      - ".github/workflows/quality-frontend.yml"
  push:
    branches: [main]
    paths:
      - "apps/admin/**"
      - "apps/api/**"
      - "docker-compose.yml"
      - "docker/**"
      - "packages/**"
      - "biome.json"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "turbo.json"
      - ".github/workflows/quality-frontend.yml"

concurrency:
  group: quality-frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # #2148 — the five fast frontend gates (guards, biome, typecheck,
  # vitest, build) run in ONE job so a single PR run stays under the
  # GitHub Free 20-concurrent-job cap, and pnpm install runs once instead
  # of four times. The two bash guards run first (fail in seconds, no
  # Node needed); each remaining step still fails the job independently.
  # Playwright E2E stays its own job (heavy docker stack, own timeout).
  frontend-checks:
    name: Frontend checks (guards + biome + tsc + vitest + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # AUD-055 — block new jsonFetch+useEffect reads (stale-data anti-pattern,
      # ADR-0021). AUD-057 — block new admin source files growing past the
      # max-lines threshold (ADR-0021 sibling: readability). Both are pure
      # bash guards over apps/admin/src — no Node/pnpm needed, run first.
      - name: jsonFetch + useEffect guard (ADR-0021)
        run: bash scripts/lint-jsonfetch-useeffect.sh

      - name: Admin max-lines guard
        run: bash scripts/lint-admin-max-lines.sh

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Biome check
        run: pnpm --filter @pim/admin lint

      - name: TypeScript typecheck
        run: pnpm --filter @pim/admin typecheck

      - name: Vitest
        run: pnpm --filter @pim/admin test

      - name: Build
        run: pnpm --filter @pim/admin build

  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    # 20 got outgrown by the suite (~16.5m tests + ~4m stack setup): the job
    # died as "canceled" AFTER "15x passed", masquerading as merge-ref flake.
    # Keep headroom; revisit when the suite gets sharded.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Map pim.localhost to 127.0.0.1
        run: echo "127.0.0.1 pim.localhost" | sudo tee -a /etc/hosts

      - name: Read JWT passphrase from apps/api/.env
        id: jwt
        run: echo "passphrase=$(grep '^JWT_PASSPHRASE=' apps/api/.env | cut -d'=' -f2)" >> "$GITHUB_OUTPUT"

      - name: Generate JWT keypair (matching .env passphrase)
        run: |
          mkdir -p apps/api/config/jwt
          openssl genpkey -algorithm RSA -out apps/api/config/jwt/private.pem -aes256 -pass pass:${{ steps.jwt.outputs.passphrase }} -pkeyopt rsa_keygen_bits:4096
          openssl pkey -in apps/api/config/jwt/private.pem -passin pass:${{ steps.jwt.outputs.passphrase }} -pubout -out apps/api/config/jwt/public.pem

      - name: Start database + redis (healthcheck deps for api)
        run: docker compose up -d --wait database redis
        env:
          POSTGRES_USER: pim
          POSTGRES_PASSWORD: ChangeMeInDev
          POSTGRES_DB: pim

      - name: Start api container (will be unhealthy until migrations)
        run: docker compose up -d api
        env:
          POSTGRES_USER: pim
          POSTGRES_PASSWORD: ChangeMeInDev
          POSTGRES_DB: pim

      - name: Wait for FrankenPHP worker to accept exec commands
        run: |
          for i in {1..30}; do
            if docker compose exec -T api php -v >/dev/null 2>&1; then
              echo "api container ready for exec"
              break
            fi
            echo "Waiting for api to accept exec... ($i/30)"
            sleep 2
          done

      - name: Run migrations + load fixtures
        # The api healthcheck hits /api which triggers RequestTenantSubscriber and
        # queries the `tenants` table — so migrations have to run before the rest
        # of the stack waits for api healthy. Fixtures stay coupled to migrations
        # because the admin user the E2E suite logs in as is seeded here.
        #
        # `cache:clear` runs first because the api container's named volume
        # pim_api_var persists /app/var/cache/dev across CI runs. Without
        # the clear, Symfony reads a stale container.xml — config tweaks in
        # apps/api/config/packages/dev/*.yaml (e.g. #867 auth_login limit
        # bump from 50 → 200) are ignored until the cache is invalidated.
        #
        # AUD-002 (W1-1): migrations already run on the `owner` connection
        # (doctrine_migrations.connection: owner → role `pim`, the table owner)
        # — DDL needs ownership the runtime `pim_app` lacks. Fixtures must ALSO
        # run as the owner: they INSERT across tables under FORCE ROW LEVEL
        # SECURITY without a per-request tenant GUC (the CLI never hits
        # RlsContextListener), so as `pim_app` (NOBYPASSRLS) every insert is
        # denied. Override DATABASE_URL to the owner DSN for the fixture load
        # only; the api runtime keeps connecting as `pim_app`.
        run: |
          docker compose exec -T api php bin/console cache:clear --env=dev --no-warmup
          docker compose exec -T api php bin/console cache:warmup --env=dev
          docker compose exec -T api php bin/console doctrine:migrations:migrate --no-interaction --env=dev
          # Use the owner DSN already provided to the container as
          # DATABASE_URL_OWNER (compose env) — expanded INSIDE the container so
          # no literal credential lives in this workflow file.
          docker compose exec -T api sh -c 'DATABASE_URL="$DATABASE_URL_OWNER" php bin/console doctrine:fixtures:load --no-interaction --env=dev'

      - name: Start the rest of the stack and wait for healthy
        # Explicit service list excludes minio-init (a one-shot `restart: no`
        # init container) and unused-for-E2E services (minio, meilisearch,
        # mailpit). `--wait` would otherwise treat the init container's
        # clean exit as a failure of the wait condition.
        run: docker compose up -d --wait database redis api admin caddy mercure
        env:
          POSTGRES_USER: pim
          POSTGRES_PASSWORD: ChangeMeInDev
          POSTGRES_DB: pim

      - name: Wait for Caddy edge to serve /api
        run: |
          for i in {1..30}; do
            if curl -ksSf -o /dev/null https://pim.localhost/api; then
              echo "Caddy edge serving /api"
              break
            fi
            echo "Waiting for Caddy... ($i/30)"
            sleep 2
          done
          curl -ksSf https://pim.localhost/api > /dev/null

      - name: Install Playwright Chromium
        run: pnpm --filter @pim/admin exec playwright install --with-deps chromium

      - name: Reset auth rate limiter cache before E2E
        # The login form uses a 5/15min IP limiter; the e2e suite triggers
        # ~10 fresh logins (and triple that on retries), so a cold cache is
        # mandatory before Playwright starts. Wipes the on-disk cache pool
        # used by Symfony's RateLimiterFactory.
        run: docker compose exec -T api rm -rf /app/var/share/dev/pools

      - name: Run Playwright tests
        run: pnpm --filter @pim/admin e2e
        env:
          CI: "true"

      - name: Upload Playwright HTML report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/admin/playwright-report
          retention-days: 7

      - name: Upload test-results (screenshots / traces) on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: apps/admin/test-results
          retention-days: 7

      - name: Dump docker-compose logs on failure
        if: failure()
        run: docker compose logs --no-color > docker-compose.log || true

      - name: Upload docker-compose logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: docker-compose-logs
          path: docker-compose.log
          retention-days: 7

      - name: Tear down stack
        if: always()
        run: docker compose down -v
