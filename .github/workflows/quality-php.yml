name: Quality (PHP)

# Runs on every PR; on push to main only the cheap static gates run — the
# heavy matrix is revalidated nightly (see `schedule` below). Rationale: a
# squash merge produces a new SHA over a tree that the PR already validated
# minutes earlier, and re-running the full matrix on main cost ~133 CI min/day
# for zero failures in the measured week (CI minutes audit, 2026-08-06).
# NOTE: there is no branch protection on this repo today (the protection API
# answers 403 on the current plan and `branches/main` reports
# "protected": false), so these gates are advisory, not enforcing.
# See ticket #11 (0.0.11) for the full quality gates rationale.

on:
  # AUD-061 — blacklist (paths-ignore), not whitelist (paths). The old `paths:`
  # whitelist (apps/api + a few scripts) silently skipped every backend gate
  # (PHPStan / PHPUnit / Deptrac / cs-fixer) on any PR that did not touch
  # apps/api/** — e.g. a PR touching only packages/shared-types/** (which feeds
  # the OpenAPI/TS contract), root composer files, or this workflow itself.
  # That meta-gap let latent PHPStan errors land on main (W1-7 TenantOffboarding-
  # PurgeTest, fixed in W2-1). A whitelist also re-opens the same hole for every
  # *future* backend-relevant directory nobody remembers to add. paths-ignore is
  # fail-safe: the gates run ALWAYS unless a PR touches ONLY pure docs/markdown.
  #
  # docs/api-spec/** is NOT ignored (it is re-included via `!`): the openapi-spec
  # job diffs docs/api-spec/v0.json, so a spec change must still re-trigger.
  pull_request:
    # `labeled` is required for the opt-in benchmark gate below: without it a
    # freshly applied `run-benchmarks` label would not re-trigger the run.
    types: [opened, synchronize, reopened, labeled]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "!docs/api-spec/**"
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "!docs/api-spec/**"
  # Nightly full validation of main. Compensates for the heavy jobs that no
  # longer run on push (matrix, benchmark, agent-removability): nothing is
  # dropped, it moves to a ≤24h window. `schedule` ignores paths filters and
  # only runs on the default branch, which is exactly the intent.
  schedule:
    - cron: "23 2 * * *"
  workflow_dispatch:

concurrency:
  group: quality-php-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: apps/api

jobs:
  # #2148 — the fast PHP static gates share ONE job (was seven: phpstan,
  # deptrac, php-cs-fixer, openapi-spec + three shell linters) so a single
  # PR run stays under the GitHub Free 20-concurrent-job cap, and the
  # checkout + PHP + composer-install setup runs once instead of four
  # times. The three shell linters run first (fail in seconds, before
  # composer install); each remaining step still fails the job
  # independently. Heavy/isolated jobs stay separate below (semgrep pin,
  # phpunit shards, benchmark, agent-removability).
  static:
    name: PHP static (phpstan + deptrac + cs-fixer + openapi + shell linters)
    runs-on: ubuntu-latest
    steps:
      # fetch-depth:0 — tracked-secrets-lint needs the real tree on
      # push-to-main (git ls-files), not a shallow clone.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # HARD-07 — raw SQL bypassing TenantFilter. AUD-017/021 — pgBackRest
      # backup cron wiring. AUD-005/010 — real secrets in tracked .env
      # files. Pure shell, run before composer install so they fail in
      # seconds. working-directory: . (repo root; job default is apps/api).
      - name: Lint raw SQL escape hatches
        working-directory: .
        run: bash scripts/lint-raw-sql.sh

      - name: Lint backup cron wiring
        working-directory: .
        run: bash scripts/lint-backup-cron.sh

      - name: Lint tracked env files for real secrets
        working-directory: .
        run: bash scripts/lint-tracked-secrets.sh

      - name: Lint prod env template completeness
        working-directory: .
        run: bash scripts/lint-prod-env-example.sh

      # GOLIVE #2192 — PHP twin of the admin max-lines guard: baseline-frozen
      # count of src/ files over 800 lines (currently 1: ImportRunHandler).
      - name: API max-lines guard
        working-directory: .
        run: bash scripts/lint-api-max-lines.sh

      # #2791 — a healthcheck that forks over TLS leaves a zombie per run when
      # PID 1 does not reap. The edge accumulated 10 489 of them (121/128 MiB)
      # and ran out of PIDs, which killed the healthcheck itself — so the
      # container reported `unhealthy` for 45 hours while serving traffic fine.
      - name: Healthcheck reaper guard
        working-directory: .
        run: bash scripts/lint-healthcheck-reaper.sh

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: ctype, iconv, intl, opcache, pcntl, pdo_pgsql, zip
          coverage: none
          tools: composer:v2

      - name: Cache Composer
        uses: actions/cache@v6
        with:
          path: |
            apps/api/vendor
            ~/.composer/cache
          key: ${{ runner.os }}-composer-${{ hashFiles('apps/api/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Generate JWT keypair (lexik bundle requires the files at compile time)
        run: |
          mkdir -p config/jwt
          openssl genpkey -algorithm RSA -out config/jwt/private.pem -aes256 -pass pass:ci -pkeyopt rsa_keygen_bits:4096
          openssl pkey -in config/jwt/private.pem -passin pass:ci -pubout -out config/jwt/public.pem

      - name: Warm up cache (PHPStan + OpenAPI export need the dev container.xml)
        run: php bin/console cache:clear --env=dev
        env:
          APP_ENV: dev
          APP_DEBUG: "1"
          DATABASE_URL: postgresql://app:app@localhost:5432/app?serverVersion=16
          MESSENGER_TRANSPORT_DSN: in-memory://
          MERCURE_URL: http://localhost/.well-known/mercure
          MERCURE_PUBLIC_URL: http://localhost/.well-known/mercure
          MERCURE_JWT_SECRET: ci-mercure-key-at-least-256-bits-long
          JWT_PASSPHRASE: ci

      - name: PHPStan
        run: composer phpstan
        env:
          APP_ENV: dev
          JWT_PASSPHRASE: ci

      - name: Deptrac analyse
        run: vendor/bin/deptrac analyse --no-progress --no-cache

      - name: PHP-CS-Fixer
        run: composer cs-check

      # Re-export the OpenAPI spec and compare against the snapshot at
      # docs/api-spec/v0.json. Fails when a PR changes API surface without
      # bumping the spec — same idea as a Doctrine schema drift check.
      - name: Export OpenAPI spec
        run: php bin/console api:openapi:export | python3 -m json.tool > /tmp/v0.expected.json
        env:
          APP_ENV: dev
          APP_DEBUG: "0"
          DATABASE_URL: postgresql://pim:ChangeMeInDev@127.0.0.1:5432/pim?serverVersion=16&charset=utf8
          JWT_PASSPHRASE: ci

      - name: Compare against snapshot
        working-directory: ${{ github.workspace }}
        run: |
          if ! diff -u docs/api-spec/v0.json /tmp/v0.expected.json; then
            echo "::error::OpenAPI spec drift — re-export with"
            echo "::error::    docker compose exec -T api php bin/console api:openapi:export | python3 -m json.tool > docs/api-spec/v0.json"
            echo "::error::and commit the result."
            exit 1
          fi

      # AGENT-P0-09 / ADR-0024 — cheap half of the open-core gate, kept on
      # EVERY PR: the core must not reference App\Agent. The full job (delete
      # the module, recompile, re-run PHPStan/Deptrac/PHPUnit, rebuild the
      # admin) is ~1.7 min of mostly repeated work and moved to the nightly
      # run. Catches use/FQCN leaks — the ~95% case; DI/string leaks still
      # need the full job, hence the nightly.
      - name: Core must not reference App\Agent (ADR-0024)
        run: |
          if grep -RFn --exclude-dir=Agent 'App\Agent' src config tests \
               | grep -vE '^(config/services_agent\.yaml|config/packages/agent\.yaml|tests/(Unit|Integration|Api)/Agent/)'; then
            echo "::error::core references App\Agent outside the agent module — see ADR-0024"
            exit 1
          fi

      # The `unit,architecture` matrix leg was ~90% job overhead (0.83 min of
      # which ~34s is setup) and needed no database, yet the matrix gave it a
      # dedicated postgres:16-alpine service. Folding it into this job removes
      # one job and one container per PR. phpunit.dist.xml marks both suites
      # as kernel-free; `agent-removability` already runs them without a DB.
      - name: PHPUnit (unit + architecture)
        run: php bin/phpunit --testsuite unit,architecture
        env:
          APP_ENV: test
          APP_DEBUG: "0"
          MESSENGER_TRANSPORT_DSN: in-memory://
          MERCURE_JWT_SECRET: ci-mercure-key-at-least-256-bits-long
          JWT_PASSPHRASE: ci
          APP_DEFAULT_TENANT_CODE: demo

  semgrep-cortex:
    # RBAC-P6-008 / #720 — Cortex-specific Semgrep rules (the static-
    # analysis companion to PHPStan's RequiresPermissionAnnotationRule).
    # Catches plaintext secrets, raw SQL without tenant filter,
    # superglobals, hasRole() bypass of the permission engine, and the
    # same missing #[RequiresPermission] shape PHPStan blocks at PR time.
    # Pre-commit hook locally; CI runs on every PR.
    name: Semgrep (Cortex RBAC rules)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    container:
      # Pin Semgrep — `latest` (>=1.130) broke parser support for the
      # `#[ORM\Entity(...)]` / `#[Route(...)]` PHP attribute patterns
      # used by cortex-entity-missing-tenant-id and
      # cortex-requires-permission-attribute-missing, and rejected the
      # mixed-language array `[yaml, json, php, generic]` on the token
      # rules. Last green run on `main` was 2026-05-22 on a 1.11x image;
      # this pin restores it. Bump together with rule pattern updates
      # when revisiting Semgrep upgrades (#891 follow-up).
      image: semgrep/semgrep:1.116.0
    steps:
      - uses: actions/checkout@v7

      - name: Semgrep scan (.semgrep/cortex-rbac.yml)
        # --severity filters keep CI blocking on ERROR + WARNING rules
        # (real defects) but allow INFO-level rules (heuristics with known
        # false-positives — e.g. cortex-raw-sql-missing-tenant-filter
        # cannot follow tenant_id through FK chains, so junction-table
        # queries trip it). Operators can still see INFO findings by
        # running semgrep locally without the filter; CI surfaces only
        # what is actionable.
        #
        # --strict is intentionally NOT passed: it treats the
        # severity-filtered-out INFO rule as a parse-only-warning and
        # exits non-zero even with 0 findings. --error alone is enough
        # for the intended gate (non-zero exit when blocking findings
        # are reported).
        run: |
          semgrep --config .semgrep/cortex-rbac.yml \
            --error --no-rewrite-rule-ids \
            --severity ERROR --severity WARNING \
            apps/api/src apps/admin/src

  phpunit:
    # AUD-083 — shard the suite across testsuites so `api` and `integration`
    # (the two DB/kernel-heavy long poles) run in PARALLEL instead of
    # sequentially in one job. `unit` (no DB, ~6s) rides with `architecture`.
    # Wall-clock drops from sum(suites) to max(suite). Each matrix leg is its
    # own job → its own Postgres service → its own pim_test DB, so there is no
    # cross-talk. The heavy 5k/50k memory benchmark moved to `phpunit-benchmark`
    # below (was a sequential step here, ~4 min reclaimed by running it concurrently).
    name: PHPUnit
    runs-on: ubuntu-latest
    # Skipped on push:main (the PR validated this very tree; a squash only
    # changes the SHA) and on npm bumps (a JS dependency cannot break PHPStan
    # or PHPUnit — composer bumps still get the full matrix). Job-level `if:`
    # rather than workflow `paths:` on purpose: a skipped job reports as
    # passed, a workflow that never starts leaves a required check hanging in
    # "Expected" forever if protection is ever turned on.
    if: >-
      ${{ github.event_name != 'push'
      && !startsWith(github.head_ref, 'dependabot/npm_and_yarn/') }}
    strategy:
      fail-fast: false
      matrix:
        # AUD-084 — `api` was the dominant leg (~1412s, ~45% of it Catalog);
        # split three ways (Catalog / Import+Identity / the rest via <exclude>)
        # so the legs run concurrently. See phpunit.dist.xml testsuites.
        # `unit,architecture` moved into the `static` job — it needed no
        # database and was almost entirely setup overhead.
        suite:
          - "integration"
          - "api-catalog"
          - "api-heavy"
          - "api-rest"
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pim
          POSTGRES_PASSWORD: ChangeMeInDev
          POSTGRES_DB: pim
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pim"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    # Hoisted to job level (was duplicated per step) — every PHPUnit invocation
    # in this job needs the same test env. Foundry's ResetDatabase rebuilds the
    # schema into the dbname_suffix-derived "pim_test" database; the Postgres
    # service is enough, no migrations step required.
    env:
      APP_ENV: test
      APP_DEBUG: "0"
      DATABASE_URL: postgresql://pim:ChangeMeInDev@127.0.0.1:5432/pim?serverVersion=16&charset=utf8
      MESSENGER_TRANSPORT_DSN: in-memory://
      MERCURE_URL: http://localhost/.well-known/mercure
      MERCURE_PUBLIC_URL: http://localhost/.well-known/mercure
      MERCURE_JWT_SECRET: ci-mercure-key-at-least-256-bits-long
      JWT_PASSPHRASE: ci
      APP_DEFAULT_TENANT_CODE: demo
    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: ctype, iconv, intl, opcache, pcntl, pdo_pgsql, zip
          coverage: none
          tools: composer:v2

      - name: Cache Composer
        uses: actions/cache@v6
        with:
          path: |
            apps/api/vendor
            ~/.composer/cache
          key: ${{ runner.os }}-composer-${{ hashFiles('apps/api/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Generate JWT keypair for tests
        run: |
          mkdir -p config/jwt
          openssl genpkey -algorithm RSA -out config/jwt/private.pem -aes256 -pass pass:ci -pkeyopt rsa_keygen_bits:4096
          openssl pkey -in config/jwt/private.pem -passin pass:ci -pubout -out config/jwt/public.pem

      - name: Run PHPUnit (${{ matrix.suite }})
        run: php bin/phpunit --testsuite ${{ matrix.suite }}

  phpunit-benchmark:
    # AUD-083 — the heavy 5k/50k import + export memory benchmark, split out of
    # the main `phpunit` job so it runs concurrently instead of as a trailing
    # sequential step (~4 min off the critical path). Same env/setup as above.
    name: PHPUnit benchmarks (import-benchmark)
    runs-on: ubuntu-latest
    # ~11.6 billable min on every push for a gate that did not fire once in
    # the measured week. The main leak vector (flush without clear in a loop)
    # stays blocked on every PR statically by
    # src/PHPStan/Rules/FlushWithoutClearInLoopRule.php in the `static` job.
    # Here: nightly, manual dispatch, or the `run-benchmarks` PR label.
    if: >-
      ${{ github.event_name == 'schedule'
      || github.event_name == 'workflow_dispatch'
      || contains(github.event.pull_request.labels.*.name, 'run-benchmarks') }}
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pim
          POSTGRES_PASSWORD: ChangeMeInDev
          POSTGRES_DB: pim
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pim"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENV: test
      APP_DEBUG: "0"
      DATABASE_URL: postgresql://pim:ChangeMeInDev@127.0.0.1:5432/pim?serverVersion=16&charset=utf8
      MESSENGER_TRANSPORT_DSN: in-memory://
      MERCURE_URL: http://localhost/.well-known/mercure
      MERCURE_PUBLIC_URL: http://localhost/.well-known/mercure
      MERCURE_JWT_SECRET: ci-mercure-key-at-least-256-bits-long
      JWT_PASSPHRASE: ci
      APP_DEFAULT_TENANT_CODE: demo
    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: ctype, iconv, intl, opcache, pcntl, pdo_pgsql, zip
          coverage: none
          tools: composer:v2

      - name: Cache Composer
        uses: actions/cache@v6
        with:
          path: |
            apps/api/vendor
            ~/.composer/cache
          key: ${{ runner.os }}-composer-${{ hashFiles('apps/api/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Generate JWT keypair for tests
        run: |
          mkdir -p config/jwt
          openssl genpkey -algorithm RSA -out config/jwt/private.pem -aes256 -pass pass:ci -pkeyopt rsa_keygen_bits:4096
          openssl pkey -in config/jwt/private.pem -passin pass:ci -pubout -out config/jwt/public.pem

      # AUD-063 — meta-assertion guarding the memory gate below. An empty
      # `--group import-benchmark` selection runs 0 tests and exits 0, so if
      # the benchmark tests are ever deleted/renamed out of the group the
      # 256 MiB ceiling would silently stop being enforced while CI stays
      # green. This step fails the job when the group is empty.
      # `^ - ` matches PHPUnit 12's per-test `--list-tests` prefix.
      - name: Assert import-benchmark group is non-empty
        run: |
          COUNT=$(php bin/phpunit --group import-benchmark --list-tests 2>/dev/null | grep -cE '^ - ' || true)
          if [ "$COUNT" -lt 1 ]; then
            echo "::error::import-benchmark group is empty — the 256 MiB memory gate would silently pass. Re-tag the benchmark tests with @group import-benchmark."
            exit 1
          fi
          echo "import-benchmark tests: $COUNT"

      # IMP2-2.6 (#1482) — etap-2 memory gate. Excluded from the default run
      # (phpunit.dist.xml <groups>); the explicit --group overrides that and
      # runs the heavy 5k/50k import + export benchmarks with a 256 MiB ceiling.
      - name: Run memory benchmarks (import-benchmark group)
        run: php bin/phpunit --group import-benchmark

  agent-removability:
    # AGENT-P0-09 (#1952, ADR-0024 a) — the open-core gate: the agent BC
    # must be physically deletable. This job removes src/Agent, its DI
    # root (config/services_agent.yaml) and its tests, then proves the
    # core still compiles, passes static analysis and the core unit +
    # architecture suites, and the admin builds with the agent flag off.
    # A failure here means a core->Agent dependency leaked — fix the
    # dependency, never this job. DoD gate for every epic-0.7 ticket.
    name: Agent removability (open-core gate)
    runs-on: ubuntu-latest
    # The cheap half of this gate (grep for App\Agent in the core) now runs on
    # every PR inside `static`. The expensive half — delete the module and
    # recompile everything, of which ~48s of 110s is a repeated PHPStan — runs
    # nightly, on demand, or on PRs labelled `agent`. Epic 0.7 is Phase 2 work
    # and src/Agent barely moves.
    # WHEN EPIC 0.7 STARTS: put this back on every PR.
    if: >-
      ${{ github.event_name == 'schedule'
      || github.event_name == 'workflow_dispatch'
      || contains(github.event.pull_request.labels.*.name, 'agent') }}
    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: ctype, iconv, intl, opcache, pcntl, pdo_pgsql, zip
          coverage: none
          tools: composer:v2

      - name: Cache Composer
        uses: actions/cache@v6
        with:
          path: |
            apps/api/vendor
            ~/.composer/cache
          key: ${{ runner.os }}-composer-${{ hashFiles('apps/api/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Generate JWT keypair (cache warmup boots Lexik)
        run: |
          mkdir -p config/jwt
          openssl genpkey -algorithm RSA -out config/jwt/private.pem -aes256 -pass pass:ci -pkeyopt rsa_keygen_bits:4096
          openssl pkey -in config/jwt/private.pem -passin pass:ci -pubout -out config/jwt/public.pem

      - name: Remove the agent module (ADR-0024 removability)
        run: |
          rm -rf src/Agent config/services_agent.yaml config/packages/agent.yaml \
                 tests/Unit/Agent tests/Integration/Agent tests/Api/Agent
          if grep -RFn 'App\Agent' src tests config; then
            echo "::error::core still references App\Agent after module removal"
            exit 1
          fi

      - name: Core container compiles without the agent
        run: php bin/console cache:clear --env=dev
        env:
          APP_ENV: dev
          APP_DEBUG: "1"
          AGENT_ENABLED: "0"
          DATABASE_URL: postgresql://app:app@localhost:5432/app?serverVersion=16
          MESSENGER_TRANSPORT_DSN: in-memory://
          MERCURE_URL: http://localhost/.well-known/mercure
          MERCURE_PUBLIC_URL: http://localhost/.well-known/mercure
          MERCURE_JWT_SECRET: ci-mercure-key-at-least-256-bits-long
          JWT_PASSPHRASE: ci

      - name: PHPStan on the agent-less tree
        run: composer phpstan
        env:
          APP_ENV: dev
          AGENT_ENABLED: "0"
          JWT_PASSPHRASE: ci

      - name: Deptrac on the agent-less tree
        run: vendor/bin/deptrac analyse --no-progress --no-cache

      - name: Core PHPUnit (unit + architecture) without the agent
        run: php bin/phpunit --testsuite unit,architecture
        env:
          APP_ENV: test
          APP_DEBUG: "0"
          AGENT_ENABLED: "0"
          DATABASE_URL: postgresql://pim:ChangeMeInDev@127.0.0.1:5432/pim?serverVersion=16&charset=utf8
          MESSENGER_TRANSPORT_DSN: in-memory://
          MERCURE_URL: http://localhost/.well-known/mercure
          MERCURE_PUBLIC_URL: http://localhost/.well-known/mercure
          MERCURE_JWT_SECRET: ci-mercure-key-at-least-256-bits-long
          JWT_PASSPHRASE: ci
          APP_DEFAULT_TENANT_CODE: demo

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install admin dependencies
        working-directory: ${{ github.workspace }}
        run: pnpm install --frozen-lockfile

      - name: Admin builds with the agent flag off
        working-directory: ${{ github.workspace }}
        run: pnpm --filter @pim/admin build
        env:
          VITE_AGENT_ENABLED: "false"
