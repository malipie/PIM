name: Security (secrets scan)

# RBAC-P1-001 (#640) — secrets-leak guard rail.
#
# Two independent scanners run in ONE job (was two — #2148, to stay under
# the GitHub Free 20-concurrent-job cap), sharing a single fetch-depth:0
# checkout. Defence in depth is preserved — either step fails the job:
#   - gitleaks: regex-based, catches predictable patterns (AWS keys,
#     Stripe tokens, Anthropic keys, JWT secrets, RSA private keys).
#   - trufflehog: high-entropy + verified-secret mode, catches keys
#     that gitleaks would miss (random-looking tokens with structure).
#
# Runs on every PR + push to main. Either failing blocks merge.
#
# Local pre-commit hook (.husky/pre-commit) runs trufflehog if installed
# — see docs/security/tooling.md for the local install instructions.

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: security-secrets-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  secret-scan:
    name: Secret scan (gitleaks + trufflehog)
    runs-on: ubuntu-latest
    # #2949 — mierzone: ~20 s (gitleaks + trufflehog). Bez limitu obowiazuje domyslne 6 h GitHuba.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          # fetch-depth: 0 lets gitleaks scan the full diff against base
          # and trufflehog resolve the PR base..head range (push: HEAD~1).
          fetch-depth: 0

      - name: Gitleaks scan
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Free tier — no licence required for public repos. Internal
          # secret-leak detection on a private repo would need GITLEAKS_LICENSE,
          # but the action degrades gracefully (logs a notice, still runs
          # the open-source rule set).
          GITLEAKS_NOTIFY_USER_LIST: "@malipie"

      - name: TruffleHog detector self-test
        env:
          # v3.97.1 linux/amd64 — immutable digest from the signed release.
          TRUFFLEHOG_IMAGE: ghcr.io/trufflesecurity/trufflehog:3.97.1@sha256:deb2af10659a488a14d262a323addcde099d99827a1cf1dc4e93c17915c39f08
        run: bash scripts/test-trufflehog-fixture.sh

      - name: TruffleHog scan
        # v3.97.1 — signed release commit, verified 2026-08-26.
        uses: trufflesecurity/trufflehog@363923b901c911a9164f50b6c423f47c15372b1c
        with:
          # The action builds IMAGE:VERSION; Docker accepts tag@digest, so the
          # scanner binary is immutable too (not merely the action wrapper).
          version: 3.97.1@sha256:deb2af10659a488a14d262a323addcde099d99827a1cf1dc4e93c17915c39f08
          # Scan the diff range for PRs, full history on push.
          # Keep unverified findings: otherwise a structurally valid secret
          # whose verifier is unavailable becomes a false negative.
          path: ./
          base: ${{ github.event.pull_request.base.sha || github.event.before }}
          head: ${{ github.event.pull_request.head.sha || github.event.after }}
          extra_args: --results=verified,unknown,unverified
