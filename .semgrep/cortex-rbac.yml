rules:
  # ---------------------------------------------------------------------------
  # RBAC-P6-010 (#722) — Cortex-specific Semgrep rules.
  #
  # These rules catch the same classes of mistakes as the PHPStan rule
  # RequiresPermissionAnnotationRule (RBAC-P1-010) plus a handful of
  # patterns that PHPStan cannot see because they live below the type
  # system (raw SQL, magic strings, plaintext secrets in YAML).
  #
  # Run locally with:
  #   docker run --rm -v "$PWD:/src" semgrep/semgrep:latest \
  #     semgrep --config /src/.semgrep/cortex-rbac.yml /src/apps/api/src
  # ---------------------------------------------------------------------------

  - id: cortex-entity-missing-tenant-id
    languages: [php]
    severity: ERROR
    message: >-
      Entity class is missing a `private string|UuidInterface $tenantId`
      property. Every domain entity must carry its tenant scope from day 1
      per CLAUDE.md "Multi-tenancy → każda tabela domenowa ma tenant_id
      UUID NOT NULL od dnia 1". Add the property + `TenantAware` interface
      so `TenantAssignmentListener` can stamp it on save.
    patterns:
      - pattern: |
          #[ORM\Entity(...)]
          $... class $C { ... }
      - pattern-not-inside: |
          class $X { ... private $TYPE $tenantId$REST; ... }
      - pattern-not-inside: |
          class $X { ... private $TYPE $tenant$REST; ... }
      - pattern-not-inside: |
          abstract class $X { ... }
      # Allow infra-only entities listed in INFRA_TABLES — they inherit
      # tenant scope through their parent FK (or are inherently platform-
      # global like Locale / Currency / refresh_tokens).
      - pattern-not-regex: |
          (?s)(class\s+(Locale|Currency|RefreshToken|RoleAttributePermission|RoleAttributeGroupPermission|ObjectCategory|ObjectValue|ObjectTypeAttribute|ObjectTypeAttributeGroup|AttributeOption|UserRole|UserAuditLog|UserApiToken|SuperAdminAudit|InvitationToken|PasswordResetToken|TotpBackupCode|BulkLog|BulkEditJob|TenantAuditLog|PendingChange|SyncJobLog|ImportSourceLog|ImportScheduleRun|ExportSession)\b)
    paths:
      include:
        - "apps/api/src/**/Domain/Entity/**/*.php"

  - id: cortex-no-direct-role-string-check
    languages: [php]
    severity: ERROR
    message: >-
      Direct role-string check (`hasRole('admin')` / `getRoles() === ['X']`)
      bypasses the RBAC permission engine. Use
      `$security->isGranted('PRD_permission_code')` or
      `#[RequiresPermission(module: ..., action: ...)]` so the matrix from
      PRD-PIM-rbac §3.2 is the single source of truth. Direct role checks
      drift silently when permissions move between roles during workflow
      refactors.
    patterns:
      - pattern-either:
          - pattern: $USER->hasRole($X)
          - pattern: in_array($X, $USER->getRoles())
          - pattern: in_array($X, $USER->getRoles(), ...)
      - pattern-not-inside: |
          class $C { ... function getRoles(...) { ... } ... }
    paths:
      include:
        - "apps/api/src/**/*.php"
      exclude:
        - "apps/api/src/Identity/**"
        - "apps/api/tests/**"

  - id: cortex-raw-sql-missing-tenant-filter
    # NOTE: severity:INFO (was WARNING). The naive `WHERE` without literal
    # `tenant_id` heuristic produces 48 false-positives against the current
    # codebase because many INFRA_TABLES inherit tenant scope through their
    # parent FK chain (object_categories.object_id → catalog_objects.tenant_id,
    # role_attribute_permissions.role_id → roles.tenant_id, etc.) rather than
    # holding a direct tenant_id column. Postgres-catalog queries
    # (information_schema, pg_index, pg_class) are also legitimate exemptions.
    #
    # Until a tenant-FK-chain-aware analysis lands (Phase 7 candidate), the
    # primary defense remains `scripts/lint-raw-sql.sh` (HARD-07 — tenant-safe
    # SQL grep with curated allow-list of infra files) plus per-row review.
    # This rule stays in the file as a documentation surface — operators can
    # run `semgrep --severity=INFO` locally to audit raw SQL without
    # blocking CI.
    languages: [php]
    severity: INFO
    message: >-
      Raw SQL `WHERE` without an explicit `tenant_id` predicate. Doctrine
      filters do not apply to DBAL Connection queries; cross-tenant reads
      are possible unless the queried table inherits tenant scope through
      an FK chain (junction tables, role_attribute_permissions, etc.) or
      the query targets a postgres-internal catalog. Review case-by-case.
    patterns:
      - pattern-either:
          - pattern: $CONN->fetchAllAssociative($SQL, ...)
          - pattern: $CONN->fetchAssociative($SQL, ...)
          - pattern: $CONN->fetchOne($SQL, ...)
          - pattern: $CONN->executeQuery($SQL, ...)
      - metavariable-regex:
          metavariable: $SQL
          regex: "(?is).*WHERE(?!.*tenant_id).*"
      - pattern-not-regex: |
          (?i)//\s*infra-only
    paths:
      include:
        - "apps/api/src/**/*.php"
      exclude:
        - "apps/api/src/Shared/Infrastructure/Audit/**"
        - "apps/api/src/Identity/**/SuperAdmin*"
        - "apps/api/src/Identity/**/BreakGlass*"
        - "apps/api/tests/**"

  - id: cortex-no-plaintext-shopify-token
    languages: [yaml, json, php, generic]
    severity: ERROR
    message: >-
      Plaintext Shopify access token (`shpat_*` / `shpss_*`) committed to
      the repo. Move to Symfony Secrets Vault (`bin/console secrets:set
      SHOPIFY_TOKEN`) or `.env.local` (gitignored). Never commit the token
      itself.
    patterns:
      - pattern-regex: |
          (shpat_|shpss_|shppa_|shpca_)[A-Za-z0-9_]{20,}
    paths:
      exclude:
        - "**/.env.local"
        - "**/.env.local.*"
        - "**/secrets/**"
        - "**/*.test.*"

  - id: cortex-no-plaintext-baselinker-token
    languages: [yaml, json, php, generic]
    severity: ERROR
    message: >-
      Plaintext BaseLinker token committed to the repo. Move to Symfony
      Secrets Vault. Never commit raw API tokens.
    patterns:
      - pattern-regex: |
          ['"]X-BLToken['"]\s*[:=]\s*['"][A-Za-z0-9]{30,}['"]
    paths:
      exclude:
        - "**/.env.local"
        - "**/*.test.*"

  - id: cortex-no-superglobals
    languages: [php]
    severity: WARNING
    message: >-
      Direct superglobal access (`$_GET` / `$_POST` / `$_REQUEST` /
      `$_COOKIE` / `$_SERVER`). Use Symfony's `Request` object
      (`$request->query`, `$request->request`, `$request->headers`,
      `$request->cookies`) so middleware, validation, and serialization
      can wrap the input.
    patterns:
      - pattern-either:
          - pattern: $_GET[...]
          - pattern: $_POST[...]
          - pattern: $_REQUEST[...]
          - pattern: $_COOKIE[...]
      # $_SERVER is allowed for KERNEL/CLI boot stages where Request is
      # not yet available. The rule fires when the access happens inside
      # a Controller / Listener / Voter / Service.
    paths:
      include:
        - "apps/api/src/**/*.php"
      exclude:
        - "apps/api/src/Kernel.php"
        - "apps/api/bin/**"
        - "apps/api/public/**"

  - id: cortex-sql-injection-string-interpolation
    languages: [php]
    severity: ERROR
    message: >-
      SQL string interpolation detected — high SQL-injection risk. Use
      parameterised queries with placeholders (`:name` or `?`) and pass
      values via the second argument array. DBAL prepared statements are
      the contract; never concatenate user input into the SQL itself.
    patterns:
      - pattern-either:
          - pattern: $CONN->executeQuery("$...{$X}$...")
          - pattern: $CONN->executeQuery("$... $X $...")
          - pattern: $CONN->fetchAllAssociative("$...{$X}$...")
          - pattern: $CONN->fetchAssociative("$...{$X}$...")
          - pattern: $CONN->fetchOne("$...{$X}$...")
      - metavariable-pattern:
          metavariable: $X
          patterns:
            - pattern-not: $request->query->get(...)
            - pattern-not: $C::$Y
    paths:
      include:
        - "apps/api/src/**/*.php"

  # TNT-P4-09 (#2910 / ADR-0036) — API nie uruchamia procesów, kropka.
  #
  # Instancje tenantów powstają i giną przez `provisioner`, jedyny komponent
  # z dostępem do gniazda Dockera. API odkłada zlecenie plikiem i nie ma czym
  # uruchomić niczego samo. Ta reguła pilnuje, żeby to się nie zmieniło
  # przypadkiem: wystarczy jedno `shell_exec` w kontrolerze i cała separacja
  # z ADR-0036 przestaje cokolwiek znaczyć, bo API działa jako `www-data`
  # w kontenerze, który zaraz ktoś „dla wygody" dopnie do socketu.
  #
  # Zakazane są WSZYSTKIE wywołania, nie tylko te z interpolacją. Reguła
  # z wyjątkiem na literały byłaby zaproszeniem do sklejania polecenia
  # z fragmentów, z których każdy z osobna wygląda niewinnie.
  - id: cortex-no-process-execution-in-api
    languages: [php]
    severity: ERROR
    message: >-
      Process execution in the API. Instances are started and stopped by the
      `provisioner` service (ADR-0036) — the only component with access to the
      Docker socket. The API enqueues a typed job and never runs a process, so
      a compromised web request cannot reach the host. If you need a new
      operation on an instance, add an action to the provisioner and enqueue
      it; do not open a shell here.
    patterns:
      - pattern-either:
          - pattern: exec(...)
          - pattern: shell_exec(...)
          - pattern: system(...)
          - pattern: passthru(...)
          - pattern: proc_open(...)
          - pattern: popen(...)
          - pattern: pcntl_exec(...)
          - pattern: new Symfony\Component\Process\Process(...)
          - pattern: Symfony\Component\Process\Process::fromShellCommandline(...)
    paths:
      include:
        - "apps/api/src/**/*.php"
      # Trzy wyjątki, każdy uruchamiany przez OPERATORA z konsoli albo
      # z workera, nigdy z żądania HTTP. Wyliczone imiennie, żeby nowy plik
      # w tych samych katalogach reguły nie omijał.
      exclude:
        # Komendy zakładania i seedowania — wołane ręcznie po wdrożeniu.
        - "apps/api/src/DataFixtures/Bootstrap/TenantBootstrapCommand.php"
        - "apps/api/src/DataFixtures/Demo/SeedElectronicsDemoCommand.php"
        # Reset bazy deweloperskiej; pod APP_ENV=prod odmawia bez --force-prod.
        - "apps/api/src/Shared/Infrastructure/Maintenance/DatabaseResetCommand.php"
        # RYZYKO REZYDUALNE, nie zwolnienie: `pgbackrest` odpalany z workera po
        # wiadomości, którą wysyła kontroler HTTP. Argumenty są tablicą stałych
        # (bez powłoki), a stanza pochodzi z konfiguracji, nie z żądania —
        # ale to JEST proces uruchamiany na skutek żądania. Opisane
        # w docs/security/threat-model.md.
        - "apps/api/src/Backup/Infrastructure/Service/PgBackRestRunner.php"

  - id: cortex-requires-permission-attribute-missing
    languages: [php]
    severity: ERROR
    message: >-
      Controller method carries `#[Route(...)]` but no
      `#[RequiresPermission(...)]` or `#[NoPermissionRequired(...)]`
      attribute. PHPStan rule RequiresPermissionAnnotationRule
      (RBAC-P1-010) catches this at PR-time; Semgrep catches the same
      pattern earlier (pre-commit hook) and provides a faster feedback
      loop. Add a permission attribute or explicitly mark the endpoint
      public.
    patterns:
      - pattern: |
          #[Route(...)]
          public function $METHOD(...) { ... }
      - pattern-not: |
          #[Route(...)]
          #[RequiresPermission(...)]
          public function $METHOD(...) { ... }
      - pattern-not: |
          #[Route(...)]
          #[NoPermissionRequired(...)]
          public function $METHOD(...) { ... }
      - pattern-not: |
          #[Route(...)]
          #[IsGranted(...)]
          #[RequiresPermission(...)]
          public function $METHOD(...) { ... }
      - pattern-not: |
          #[Route(...)]
          #[IsGranted(...)]
          #[NoPermissionRequired(...)]
          public function $METHOD(...) { ... }
    paths:
      include:
        - "apps/api/src/**/Presentation/**/*Controller.php"
        - "apps/api/src/**/Presentation/*Controller.php"
      exclude:
        - "apps/api/src/**/Internal/Test*Controller.php"
