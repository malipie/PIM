# AGENT-P1-01 (#1953) — Doctrine surface of the removable Agent BC
# (ADR-0024 a). Lives in its own package file so the whole module is
# deletable: the removability CI job removes src/Agent,
# config/services_agent.yaml AND this file; without it the core ORM has
# no agent mappings and no agent migrations namespace. Agent tables
# left behind in an existing database are inert (nothing references
# them).

doctrine:
    orm:
        mappings:
            Agent:
                type: xml
                is_bundle: false
                dir: '%kernel.project_dir%/src/Agent/Infrastructure/Doctrine/Orm/Mapping'
                prefix: 'App\Agent\Domain\Entity'
                alias: Agent

doctrine_migrations:
    migrations_paths:
        # Module-namespace migrations (ADR-0024 a): agent entity DDL
        # ships inside src/Agent so it disappears with the module. Core
        # hooks (pending_changes etc.) stay in /migrations.
        'AgentMigrations': '%kernel.project_dir%/src/Agent/Infrastructure/Migrations'

framework:
    messenger:
        routing:
            # AGENT-P1-03 (#1955) — the loop runs async on the queue the
            # dev/prod worker already consumes; TenantAwareMessage rebinds
            # tenant + RLS GUC in the worker middlewares.
            App\Agent\Application\Run\AgentRunMessage: import
    serializer:
        mapping:
            paths:
                # AICG-P1-03 (#2329) — serialization groups of the AICG
                # settings resources; contributed from this deletable file
                # (NOT framework.yaml) so the removability contract holds.
                - '%kernel.project_dir%/src/Agent/Infrastructure/Serializer'

api_platform:
    mapping:
        paths:
            # AICG-P1-03 (#2329) — ContentRecipe + BrandVoiceProfile as
            # API Platform resources (ADR-0020). Path contributed here for
            # the same removability reason as the serializer path above.
            - '%kernel.project_dir%/src/Agent/Infrastructure/ApiPlatform/Resource'
