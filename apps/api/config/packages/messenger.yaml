framework:
    messenger:
        # Failed-handler envelopes are routed here so the worker pool can be
        # restarted without losing payloads. `messenger:failed:show` lists
        # them; `messenger:failed:retry` replays the queue.
        failure_transport: failed

        transports:
            # Synchronous in-process delivery — used for everything that
            # must complete inside the request lifecycle (CRUD commands,
            # event publishers that update read models / Mercure / webhooks).
            sync: 'sync://'

            # Asynchronous worker transport. Only background jobs route
            # here (bulk reindex, future agent jobs). The DSN is read
            # from `MESSENGER_TRANSPORT_DSN`; `.env.test` and
            # `.env.dev` override to `sync://` so handlers run in-band
            # during local + CI runs. Production points it at
            # `doctrine://default?queue_name=async` so the FrankenPHP
            # worker pool drains the queue.
            async:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                # IMP2-2.9 (#1485) — lock contention (a long import holding the
                # per-tenant bulk lock) is retried with a long backoff instead of
                # dead-lettering after ~7 s: 5 retries, 30 s → 60 → 120 → 240 →
                # capped 300 s ≈ 16 min total, covering a realistic import window.
                retry_strategy:
                    max_retries: 5
                    delay: 30000
                    multiplier: 2
                    max_delay: 300000

            # IMP2-1.6a (#1468, ADR-0019 D8) — dedicated import queue so a
            # 200k-row import never starves UI-adjacent async jobs (Akeneo's
            # ui_job / import_export_job split). Doctrine transport with a
            # redeliver window safely above the worst-case import duration:
            # the worker heartbeats per chunk, a crashed run is re-delivered
            # and resumes idempotently (checkpoint lands in IMP2-2.3 #1479).
            import:
                dsn: '%env(MESSENGER_IMPORT_TRANSPORT_DSN)%'
                options:
                    queue_name: import
                    redeliver_timeout: 14400
                # IMP2-2.9 (#1485) — same long-backoff policy for import lock
                # contention (see `async`).
                retry_strategy:
                    max_retries: 5
                    delay: 30000
                    multiplier: 2
                    max_delay: 300000

            # auto_setup=0 (GOLIVE #2177): the runtime role `pim_app` has no
            # DDL rights since W1-1, so an auto-setup CREATE TABLE on a fresh
            # install fails with "permission denied for schema public" and
            # crashloops the worker. The table is owned by migrations now
            # (Version20260704050000) — consistent with the env-driven DSNs.
            failed: 'doctrine://default?queue_name=failed&auto_setup=0'

        buses:
            messenger.bus.default:
                # Domain events emitted by AggregateRoot::recordThat() may have
                # no subscribers in MVP (UserAuthenticated, RefreshTokenRotated)
                # — Faza 1+ adds them. allow_no_handlers stops Messenger from
                # raising NoHandlerForMessageException in that case while still
                # delivering to every registered handler.
                default_middleware:
                    enabled: true
                    allow_no_handlers: true
                middleware:
                    # Rebinds TenantContext on async handlers (audit
                    # HIGH-002 / 2026-04-29). Sync dispatches pass
                    # through — the request listener already set the
                    # context from the JWT principal.
                    - 'App\Shared\Infrastructure\Messenger\TenantContextRebindingMiddleware'
                    # IMP2-2.5 (#1481) — sets the Postgres `app.current_tenant`
                    # GUC RLS policies read, so worker handlers stay isolated
                    # once FORCE RLS lands. Runs after the rebinding above (PHP
                    # TenantContext) and before the transaction opens.
                    - 'App\Shared\Infrastructure\Messenger\TenantRlsGucMiddleware'
                    # IMP2-2.6 (#1482) — drains the Meilisearch index collector
                    # after a worker message. After the tenant rebind + RLS GUC
                    # (so the drain reads through a bound tenant) and before
                    # doctrine_transaction (so its finally runs post-commit):
                    # bulk async ops (import, bulk-edit/-delete) otherwise queue
                    # upserts a worker never flushes (no per-message terminate).
                    - 'App\Search\Application\CatalogIndexDrainMiddleware'
                    - 'App\Shared\Infrastructure\Messenger\IdempotencyMiddleware'
                    - doctrine_transaction

        # Explicit routing per message class (audit MEDIUM-007).
        #
        # Every async-routed message gets a dedicated entry below so the
        # destination transport stays the same across prod / dev / test —
        # the audit's central concern was that an empty routing block
        # silently diverges once an async transport ships in production.
        #
        # Domain events + Application Commands intentionally stay UNROUTED
        # (default `messenger.bus.default` synchronous handler dispatch).
        # Routing them through the `sync` transport adds an extra
        # Send → Receive hop per event, which under bulk seed paths
        # (DemoCatalogSeeder fires hundreds of events with fail-soft HTTP
        # publishers) shows up as ErrorChunk accumulation before GC catches
        # up. Default in-process dispatch is the established (and tested)
        # behavior — the audit recommendation is satisfied by ensuring
        # everything that DOES need a transport has its routing pinned.
        #
        # To onboard a new ASYNC message class: add an entry below AND a
        # dedicated test asserting the routing destination. Synchronous
        # message classes do not need entries.
        routing:
            # ---- Background jobs — asynchronous.
            # Bulk import / agent ops dispatch this to the worker pool so
            # the request thread does not stall on N×rebuild work. In
            # dev / test the async transport is a `sync://` alias so
            # behavior stays in-band without a worker.
            App\Catalog\Application\Message\ObjectValuesChangedMessage: async

            # CHC-05 (#1287) — after a confirmed category move that affects
            # products, the CHC-04 handler re-checks each product's schema
            # snapshot for drift off the request thread. `allow_no_handlers`
            # makes this a safe no-op enqueue until the CHC-04 handler lands.
            App\Catalog\Application\Message\CheckSchemaDriftForCategory: async

            # CHC-07 / #1314 — when a product's master-category set changes, the
            # Channel handler reconciles its channel placements from all its
            # categories' node mappings off the request thread. Recorded on the
            # CatalogObject aggregate, dispatched post-flush; async keeps the
            # category-assignment request fast.
            App\Catalog\Contracts\Event\ObjectCategoriesChanged: async

            # #1314 — back-fill: after a channel node-mapping changes, reconcile
            # placements for every product in the affected master category.
            App\Channel\Application\Message\ReconcileChannelPlacementsForCategory: async

            # DAM thumbnail pipeline (#438). The upload request returns
            # 201 immediately and the worker generates the 200×200 +
            # 800×800 WebP variants out-of-band. In dev / test the
            # async transport is `sync://`, so behaviour stays in-band
            # without spinning a worker.
            App\Asset\Contracts\Event\AssetThumbnailsRequested: async

            # Imports MVP (#445). Wizard `POST /api/import-sessions`
            # returns 201 immediately and the worker streams the file
            # row-by-row via {@see ImportRunHandler}. Sync small (<50
            # rows) imports bypass dispatch by calling `run()` directly
            # on the same handler from the controller.
            App\Import\Domain\Message\ImportRunMessage: import

            # APIC-P3-04 — inbound sync of a SyncBinding. Reuses the `import`
            # transport/worker (epic transport decision); TenantAwareMessage so
            # the rebinding + RLS-GUC middleware restore tenant context first.
            App\Integration\Generic\Domain\Message\InboundSyncMessage: import

            # APIC-P3-06 — outbound sync (PIM → remote). Same import transport.
            App\Integration\Generic\Domain\Message\OutboundSyncMessage: import

            # IMP2-1.12 (#1475). Image-download batches buffered by the import
            # run and dispatched after the row phase. Same dedicated `import`
            # queue so media never starves UI-adjacent async jobs.
            App\Import\Domain\Message\ImageDownloadMessage: import

            # Exports MVP (EXP-05/06). `POST /api/products/export` returns 202
            # for target_count >= SYNC_THRESHOLD and dispatches this message so
            # ExportJobHandler runs the export out-of-band. WITHOUT this entry
            # the class is unrouted → handled synchronously in-process, so the
            # whole export runs inside the HTTP request and exhausts the 256 MB
            # FrankenPHP budget (dev: web profiler + SQL logger accumulate every
            # query). Routed to the shared `import` queue (Akeneo's
            # import_export_job split) — both the dev worker (`import
            # scheduler_maintenance`) and prod worker (`async import`) already
            # consume it, so no docker-compose change is needed.
            App\Export\Domain\Message\RunExportMessage: import

            # XMLF-P4-02 (#1926) — async feed regeneration. Same import/export
            # worker split as RunExportMessage: a 50k-SKU feed streams to MinIO
            # out-of-band (FeedRunHandler) with progress over Mercure.
            # TenantAwareMessage so the rebinding + RLS-GUC middleware restore
            # tenant context on the worker before the handler loads the run.
            App\Export\Feed\Domain\Message\RunFeedMessage: import

            # CPDF-P3-01 — async PDF catalog generation. Same import/export
            # worker split as RunFeedMessage: a catalog renders to the cache
            # out-of-band (GenerateCatalogHandler) with progress over Mercure.
            # TenantAwareMessage so the rebinding + RLS-GUC middleware restore
            # tenant context on the worker before the handler loads the run.
            App\Export\Catalog\Domain\Message\RunCatalogMessage: import

            # APIC-P4-05 — producer webhook delivery. Async so the originating
            # write never blocks on a slow integrator; the `async` retry strategy
            # (5×, exponential) backs off failures and dead-letters to `failed`.
            App\ApiConfigurator\Domain\Message\WebhookDeliveryMessage: async

            # Imports MVP (#447). pgBackRest snapshot can take 5-30
            # minutes — handler runs out-of-band so `POST /api/backups`
            # returns 202 immediately and the wizard polls
            # `GET /api/backups/{id}` for status.
            App\Backup\Domain\Message\BackupSnapshotMessage: async
