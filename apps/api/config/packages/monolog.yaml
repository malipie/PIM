# Application logging (go-live gap, 2026-08-06 recon): until now the API ran
# on the framework's bare default logger — no levels, no channels, no JSON.
# Containers log to stderr; the docker log driver (or a shipper) owns
# retention. GDPR note: request logs can carry user e-mails — keep the
# json-file driver capped on the host (see deploy runbook §7).

monolog:
    channels:
        # Deprecations separated so prod can drop them from the main stream.
        - deprecation

when@dev:
    monolog:
        handlers:
            main:
                type: stream
                path: php://stderr
                level: debug
                channels: ["!event", "!deprecation"]

when@test:
    monolog:
        handlers:
            # Only surface log noise when a test actually errors.
            main:
                type: fingers_crossed
                action_level: error
                handler: nested
                channels: ["!event", "!deprecation"]
            nested:
                type: stream
                path: php://stderr
                level: debug

when@prod:
    monolog:
        handlers:
            # Buffered: INFO+ context is emitted only when an ERROR occurs,
            # so steady-state stderr stays quiet but incidents arrive with
            # the 50 preceding records attached.
            main:
                type: fingers_crossed
                action_level: error
                buffer_size: 50
                handler: nested
                # #2881 — 401 and 403 join 404/405 as codes that do NOT
                # open an incident. A permission denial is the RBAC layer
                # working, not failing: with the two catalogues in play a
                # healthy tenant produces them all day, and each one used
                # to flush the whole 50-record buffer — DEBUG security
                # chatter, the exception, the stack trace — so a normal
                # afternoon read like an outage. The denial itself is not
                # lost: Symfony logs it at ERROR, which the `warnings`
                # handler below emits unconditionally, so one denial is
                # one line instead of fifty.
                excluded_http_codes: [401, 403, 404, 405]
                channels: ["!event", "!deprecation"]
            nested:
                type: stream
                path: php://stderr
                level: info
                formatter: monolog.formatter.json
            # Operational lane: WARNING+ always lands on stderr (JSON) even
            # without a triggering error — rate-limit hits, retries, degraded
            # dependencies.
            warnings:
                type: stream
                path: php://stderr
                level: warning
                formatter: monolog.formatter.json
                channels: ["!event", "!deprecation"]
