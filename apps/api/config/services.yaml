# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# AGENT-P0-09 (#1952) — the agent's whole DI surface lives in
# services_agent.yaml; `not_found` is tolerated so `rm -rf src/Agent`
# + removing that file leaves a compiling core (ADR-0024 removability).
imports:
    - { resource: services_agent.yaml, ignore_errors: not_found }

parameters:
    # Sprint 0 fallback: until full auth lands in #4 / #24, the listener resolves
    # the active tenant by code from this env var. Smoke test #12 (0.0.12) flips
    # the env between two seeded tenants to verify isolation. Production sets it
    # only for the BYOK admin / migration commands; everything else relies on the
    # authenticated user (TenantAware).
    app.default_tenant_code: '%env(default::APP_DEFAULT_TENANT_CODE)%'

    # Refresh-token cookie (#28). TTL is an ISO-8601 interval so the same value
    # drives both the persisted `expires_at` column and the cookie `Max-Age`.
    # `cookie_secure` is forced false in `when@test` because BrowserKit talks
    # plain HTTP to the kernel and would silently drop `Secure` cookies on
    # follow-up requests, which would break round-trip refresh tests.
    pim.refresh_token.cookie_name: 'pim_refresh_token'
    pim.refresh_token.ttl: 'P30D'
    pim.refresh_token.cookie_secure: true

    # Catalog feature flags (#32). `enable_custom_object_types` blocks the
    # creation of ObjectType rows with kind=custom in MVP — only the three
    # built-in kinds (product/category/asset) are available. Phase 2 unlocks
    # custom kinds together with the agent tool `create_object_type` (R-29
    # mitigation: "custom kinds without UX support is an over-engineering
    # trap"). Tests pass the flag through the constructor directly when
    # they need to exercise the unlocked path.
    # 2026-05-01 (UI-02 follow-up): flipped to true so the modeling UI
    # exposes a Create custom ObjectType flow today. The DB schema has
    # supported `kind=custom` rows from day 1 (R-29 mitigation), and the
    # admin already has the form (`<CreateCustomObjectTypeDialog>`)
    # backed by the new `POST /api/object_types` endpoint. Override
    # back to `false` per-tenant once role gating ships in Faza 1
    # ADR-013.
    pim.catalog.enable_custom_object_types: '%env(bool:CATALOG_ENABLE_CUSTOM_OBJECT_TYPES)%'
    # WFL-P5-01 (#2431) — tenant-editable workflow definitions (ADR-0029
    # pillar 7). Default OFF; the provider falls back to the static YAML.
    pim.workflow.custom_definitions: '%env(bool:WORKFLOW_CUSTOM_DEFINITIONS)%'

    # AUD-050 (W2-11) — free-tier export retention window in days (GDPR / RODO).
    # `pim:exports:cleanup` erases free-tier exports older than this; paid tiers
    # keep exports forever (PRD §11.7). Default 7 lives in .env; tune per deploy.
    pim.export.free_retention_days: '%env(int:EXPORT_FREE_RETENTION_DAYS)%'

    # Asset upload limits (#438 — DAM MVP). Per-MIME caps decoupled
    # because PDFs are realistically larger than product imagery yet
    # still bounded; raster images stop at 25 MB so a power-user dump
    # of 50 hi-res JPEGs cannot saturate a worker. Validation lives in
    # `UploadAssetController`; the matching frontend constant in
    # `apps/admin/src/lib/asset-upload.ts` mirrors these so the
    # dropzone rejects oversize files before the bytes hit the wire.
    pim.asset.upload.max_image_bytes: 26214400   # 25 MB
    pim.asset.upload.max_pdf_bytes: 52428800     # 50 MB

    # IMP-02 (#443) — rules-based mapping dictionary path. Loaded once
    # per container build, then served from `cache.app` for 5 min so
    # the wizard's auto-map step does not re-parse the YAML on every
    # column header.
    pim.imports.dictionary_path: '%kernel.project_dir%/config/imports/mapping_dictionary.yaml'

services:
    _defaults:
        autowire: true
        autoconfigure: true

    # Auto-tag concrete AP4 Doctrine filters (#43 / 0.4.3) so resource
    # XML references work without per-class tag entries below.
    _instanceof:
        ApiPlatform\Doctrine\Orm\Filter\FilterInterface:
            tags: ['api_platform.filter']

        # APIC-P2-03 — collect the consumer pagination drivers so
        # PaginationStrategies can index them by name.
        App\Integration\Generic\Infrastructure\Http\Pagination\PaginationStrategy:
            tags: ['integration.pagination_strategy']

    App\:
        resource: '../src/'
        exclude:
            # AGENT-P0-09 (#1952) — the agent module's discovery root lives
            # in services_agent.yaml so the module is deletable wholesale
            # (supersedes the narrower P1-01 migrations-only exclude).
            - '../src/Agent/'

    # CPDF-P0-03 / CPDF-P6-03 (ADR-0027) — the PdfRenderer port resolves through
    # a factory: `CATALOG_PDF_RENDERER=gotenberg` + `GOTENBERG_URL` activate the
    # headless-Chromium sidecar (docker compose --profile gotenberg), anything
    # else falls back to the zero-infra in-process Dompdf default.
    App\Export\Catalog\Infrastructure\Renderer\CatalogPdfRendererFactory:
        arguments:
            $renderer: '%env(default::CATALOG_PDF_RENDERER)%'
            $gotenbergUrl: '%env(default::GOTENBERG_URL)%'
    App\Export\Contracts\PdfRenderer:
        factory: ['@App\Export\Catalog\Infrastructure\Renderer\CatalogPdfRendererFactory', 'create']

    # CPDF-P6-04 (decision A) — product cap for in-process renderers (Dompdf
    # builds the whole document in PHP memory; exceeding the cap raises a clear
    # "enable Gotenberg" error instead of OOM-killing the worker). Benchmarked
    # default in apps/api/.env; renderers with supportsLargeDocuments() render
    # uncapped.
    App\Export\Catalog\Application\CatalogRenderService:
        arguments:
            $maxInMemoryItems: '%env(int:CATALOG_PDF_MAX_ITEMS)%'
            $hqImageMaxItems: '%env(int:CATALOG_PDF_HQ_IMAGE_MAX_ITEMS)%'

    # #2608 — catalog PDF chrome: the print fonts are vendored TTF subsets
    # embedded as data: URIs (the one src both Dompdf and Gotenberg resolve);
    # the provider memoises them per worker process.
    App\Export\Catalog\Infrastructure\Template\CatalogPdfFontProvider:
        arguments:
            $fontDir: '%kernel.project_dir%/assets/pdf-fonts'

    # W2-7 / AUD-042 — single RFC 7807 contract for custom controllers.
    # `$debug` is bound to the kernel flag so the listener can keep the
    # real exception message in `detail` for 5xx locally while collapsing
    # it to the generic status text in prod. `class`/`trace` are never
    # emitted regardless of env (the FQCN is the information leak).
    App\Workflow\Application\EditorialWorkflowProvider:
        arguments:
            $customDefinitionsEnabled: '%pim.workflow.custom_definitions%'

    # WFL-P5-03 (#2433) — the identity bootstrap carries runtime feature
    # flags so the SPA can hide the Settings -> Workflow section when the
    # deployment runs with custom definitions off.
    App\Identity\Presentation\MeController:
        arguments:
            $workflowCustomDefinitionsEnabled: '%pim.workflow.custom_definitions%'

    App\Shared\Infrastructure\Http\Rfc7807ExceptionListener:
        arguments:
            $debug: '%kernel.debug%'

    # W2-9 / AUD-045 — application-level JSON request body cap. Autoconfigure
    # tags the EventSubscriberInterface; only the byte limit needs binding.
    # 10 MB default (env-overridable); .env.test lowers it to 1 KB.
    App\Shared\Infrastructure\Http\RequestBodySizeLimitListener:
        arguments:
            $maxBytes: '%env(int:API_MAX_JSON_BODY_BYTES)%'

    App\Identity\Application\CurrentTenantProvider:
        arguments:
            $defaultTenantCode: '%app.default_tenant_code%'
            # AUD-064 (W3-5.2): the unauthenticated env-default fallback is a
            # dev/test convenience only. The provider gates it to non-prod so
            # an anonymous request in prod denies (null) instead of silently
            # inheriting the `demo` tenant. The prod overlay also clears
            # APP_DEFAULT_TENANT_CODE as defence in depth.
            $environment: '%kernel.environment%'

    App\Identity\Application\RefreshTokenService:
        arguments:
            $ttl: '%pim.refresh_token.ttl%'

    App\Identity\Presentation\AuthCookieFactory:
        arguments:
            $cookieName: '%pim.refresh_token.cookie_name%'
            $ttl: '%pim.refresh_token.ttl%'
            $secure: '%pim.refresh_token.cookie_secure%'

    App\Identity\Presentation\LoginSuccessHandler:
        arguments:
            $inner: '@lexik_jwt_authentication.handler.authentication_success'

    # AUD-007 (#1577) — bind the kernel environment into the controllers
    # that ship the dev-only magic-link / password-reset plaintext token.
    # The DevTokenExposure trait omits `token_dev_only` from the JSON body
    # when env === 'prod' (PUBLIC_ACCESS endpoints → leaking it = account
    # takeover). Bound explicitly because a scalar string argument is not
    # autowired. Drop these once the mailer fully replaces the in-response
    # token and the field is removed outright.
    App\Identity\Presentation\Controller\PasswordResetController:
        arguments:
            $devTokenEnvironment: '%kernel.environment%'

    App\Identity\Presentation\Controller\InvitationController:
        arguments:
            $devTokenEnvironment: '%kernel.environment%'

    App\Identity\Presentation\Controller\InvitationActionsController:
        arguments:
            $devTokenEnvironment: '%kernel.environment%'

    # AGENT-P6-06 (#1979) — BYOK key settings surface. The env is read
    # directly (not via the removable pim.agent.enabled param) so this
    # CORE controller keeps compiling when the agent module is removed;
    # with the flag off it simply reports agent_feature_enabled=false.
    App\Identity\Presentation\Controller\AgentKeyController:
        arguments:
            $agentFeatureEnabled: '%env(bool:AGENT_ENABLED)%'

    App\Catalog\Application\ObjectTypeService:
        arguments:
            $enableCustomObjectTypes: '%pim.catalog.enable_custom_object_types%'

    # DAM MVP upload entry point (#438). The size caps are wired through
    # parameters so deployment-specific overrides land in env vars
    # (e.g. enterprise tier raises the PDF cap).
    App\Asset\Presentation\Controller\UploadAssetController:
        arguments:
            $maxImageBytes: '%pim.asset.upload.max_image_bytes%'
            $maxPdfBytes: '%pim.asset.upload.max_pdf_bytes%'

    # Bind the assets storage operator to the Imagick processor so the
    # async thumbnail handler picks the right Flysystem instance from
    # the Flysystem bundle (the bundle exposes one operator per
    # filesystem name).
    App\Asset\Application\Thumbnail\ImageProcessorInterface:
        alias: App\Asset\Infrastructure\Thumbnail\ImagickImageProcessor

    # AUD-006 (#1576) — public port for the preview-URL signer. The Catalog
    # read overlay signs `previewUrl` per request through this interface
    # (deptrac: Catalog → Asset_Contracts), so the implementation must be
    # aliased to the contract explicitly (autowiring does not map an
    # interface to its single implementation on its own).
    App\Asset\Contracts\Service\AssetPreviewSigner:
        alias: App\Asset\Application\AssetPreviewUrlSigner

    # AGENT-P2-01 (#1958) — grounding seam for cross-BC consumers (the
    # agent's search_catalog tool): explicit alias so the Contracts
    # interface resolves without importing Search internals.
    App\Search\Contracts\CatalogQueryPort:
        alias: App\Search\Application\AgentCatalogQueryAdapter

    # AGENT-P2-03 (#1960) — completeness aggregate seam (read-only).
    App\Catalog\Contracts\Query\CompletenessReportPort:
        alias: App\Catalog\Application\Query\SqlCompletenessReport

    # AGENT-P3-01 (#1961) — write-through-approval seam: materializes
    # value-edit diffs into pending_changes (commit is post-accept).
    App\Catalog\Contracts\Command\BulkEditValuesPort:
        alias: App\Catalog\Application\PendingChanges\BulkEditValuesMaterializer

    # AGENT-P3-02 (#1962) — post-approval commit seam: accepted pending
    # batches reach the catalog through the real bulk-path.
    App\Catalog\Contracts\Command\PendingBatchCommitPort:
        alias: App\Catalog\Application\PendingChanges\PendingBatchCommitter

    # AGENT-P3-04 (#1964) — value-canonical rollback of a committed agent
    # batch by BulkSession id.
    App\Catalog\Contracts\Command\BulkRollbackPort:
        alias: App\Catalog\Application\PendingChanges\ObjectValueRollbackHandler

    # AGENT-P3-05 (#1965) — category-assignment-through-approval seam.
    App\Catalog\Contracts\Command\AssignCategoriesPort:
        alias: App\Catalog\Application\PendingChanges\AssignCategoriesMaterializer

    # AGENT-P3-06 (#1966) — export-as-action seam (no approval diff).
    App\Export\Contracts\ExportTriggerPort:
        alias: App\Export\Application\AgentExportTrigger

    # AGENT-P5-01 (#1970) — approved schema batches replay through the
    # structural import creators.
    App\Import\Contracts\SchemaImportPort:
        alias: App\Import\Application\Service\AgentSchemaImportApplier

    # AGENT-P7-01 (#1981) — feed configurator seam (suggest structure on
    # a sample + regenerate-as-action).
    App\Export\Contracts\FeedAssistPort:
        alias: App\Export\Feed\Application\AgentFeedAssist

    # AGENT-P7-02 (#1982) — ENGINE-GATED publish seam: epics 0.8/0.9
    # swap this alias for the real connector dispatcher.
    App\Integration\Contracts\ChannelPublishPort:
        alias: App\Integration\Application\UnavailableChannelPublisher

    # AGENT-P8-02 (#1984) — deterministic mapping baseline for the
    # AI-assisted column suggestions.
    App\Import\Contracts\ColumnMappingPort:
        alias: App\Import\Application\Service\AgentColumnMappingAssist

    # AGENT-P8-01 (#1983) — proactive-scan opt-in reader.
    App\Identity\Contracts\Byok\ByokConfigReaderInterface:
        alias: App\Identity\Application\ByokKeyManager

    # AGENT-P8-05 (#1987) — per-role agent autonomy resolver.
    App\Identity\Contracts\Policy\AgentAutonomyResolverInterface:
        alias: App\Identity\Infrastructure\Policy\RoleAgentAutonomyResolver

    # Per-AttributeType validator dispatcher (#39). The factory wires up
    # one validator per AttributeType so the rest of the app can ask
    # "is this {value: ...} payload valid against this Attribute?" without
    # branching on the type. New types: extend the factory + add the
    # matching TypeValidator implementation.
    App\Catalog\Application\Validation\AttributeValueValidator:
        factory: ['App\Catalog\Application\Validation\AttributeValueValidator', 'default']
        # #1261 — inject the option repository so Select/Multiselect validators
        # enforce membership against the live `attribute_options` table.
        arguments:
            $optionRepository: '@App\Catalog\Domain\Repository\AttributeOptionRepositoryInterface'

    # Kind-aware ApiResource hooks (#128). Built-in Product/Category/Asset
    # ship via dedicated sugar paths in #41; this layer holds the metadata
    # + decorator the AP4 declarations call into. Wired up now so #41 only
    # has to drop the `#[ApiResource]` annotations + per-kind normalizers
    # — no bootstrap chain change required.
    App\Catalog\Infrastructure\ApiPlatform\CustomObjectTypeApiGuard:
        arguments:
            $enableCustomObjectTypes: '%pim.catalog.enable_custom_object_types%'

    App\Catalog\Infrastructure\ApiPlatform\KindAwareSerializerContextBuilder:
        decorates: 'api_platform.serializer.context_builder'
        arguments:
            $decorated: '@.inner'

    # #1148 — GET-item provider that overlays per-locale attribute values
    # when `?locale=` is present. Wraps the default Doctrine ORM item
    # provider (autowire cannot resolve the generic ProviderInterface to
    # that specific service, so bind it explicitly).
    App\Catalog\Infrastructure\ApiPlatform\State\CatalogObjectLocaleOverlayProvider:
        arguments:
            $itemProvider: '@api_platform.doctrine.orm.state.item_provider'

    # #1223 — GetCollection provider that overlays per-locale/channel values
    # on the full collection result page (N+1 prevention via batch load).
    App\Catalog\Infrastructure\ApiPlatform\State\CatalogObjectCollectionLocaleOverlayProvider:
        arguments:
            $collectionProvider: '@api_platform.doctrine.orm.state.collection_provider'

    # Context-scope decorator (#42 / 0.4.2). Wraps the KindAware decorator
    # so the chain is: AP4 default → KindAware (per-kind groups, opt-in)
    # → ContextScope (?context=integration|public override). Explicit
    # `decoration_priority: 10` keeps this on the outside even if more
    # decorators land on `api_platform.serializer.context_builder`.
    App\Catalog\Infrastructure\ApiPlatform\ContextScopeSerializerContextBuilder:
        decorates: 'api_platform.serializer.context_builder'
        decoration_priority: 10
        arguments:
            $decorated: '@.inner'

    # AP4 4.x XmlResourceExtractor returns paginationViaCursor as an
    # assoc array (`['id' => 'DESC']`) but the Hydra normalizer iterates
    # it as a list of `{field, direction}` dicts (#44 / 0.4.4). The
    # decorator below slots into the metadata factory chain and rewrites
    # the shape so every operation gets the canonical structure before
    # AP4 reads it. `decoration_priority: -10` runs after the cache
    # decorator so the result is cached.
    App\Catalog\Infrastructure\ApiPlatform\CursorPaginationFieldsNormalizer:
        decorates: 'api_platform.metadata.resource.metadata_collection_factory'
        decoration_priority: -10
        arguments:
            $decorated: '@.inner'

    # AP4 cursor pagination needs OrderFilter + RangeFilter pinned to the
    # cursor field (`id` for CatalogObject — Uuid v7 is monotonic so it
    # doubles as the chronological key). Both vendor classes are `final`,
    # so subclassing isn't an option — instead we wire concrete instances
    # parameterised with `properties` and reference them in the resource
    # XML by service id (`<filter>app.catalog.filter.order_by_id</filter>`).
    App\Catalog\Infrastructure\ApiPlatform\Filter\OrderById:
        class: ApiPlatform\Doctrine\Orm\Filter\OrderFilter
        autoconfigure: false
        autowire: false
        public: true
        tags: ['api_platform.filter']
        arguments:
            $managerRegistry: '@doctrine'
            $orderParameterName: 'order'
            # GRID-P5-03 (#2399) — system list columns sort on core fields;
            # `id` stays the cursor key, the rest serve the header clicks.
            $properties: { id: DESC, code: ~, status: ~, completenessPct: ~, updatedAt: ~ }

    # Meilisearch client factory (#49 / 0.5.1). MEILI_URL + MEILI_KEY come
    # from docker-compose env (MEILI_KEY defaults to the dev master key).
    # `default::` env-resolver keeps cache-warmup happy when env isn't
    # injected (PHPStan CI boots the container without docker-compose).
    App\Search\Infrastructure\MeilisearchClientFactory:
        arguments:
            $url: '%env(default::MEILI_URL)%'
            $masterKey: '%env(default::MEILI_KEY)%'

    # Mercure topic base for progress publishers (IMP2-0.2 / #1461).
    # Subscribers (admin SPA) build the same topics from
    # window.location.origin — the value must match the public origin.
    App\Import\Application\Service\ImportProgressPublisher:
        arguments:
            $topicBase: '%env(MERCURE_TOPIC_BASE)%'
    App\Export\Application\Async\ExportProgressPublisher:
        arguments:
            $topicBase: '%env(MERCURE_TOPIC_BASE)%'
    # XMLF-P4-02 — feed regeneration progress topic (tenant/{tid}/feeds/{id}/runs);
    # the regenerate endpoint returns the same topic as `mercure_topic`.
    App\Export\Feed\Application\Async\FeedProgressPublisher:
        arguments:
            $topicBase: '%env(MERCURE_TOPIC_BASE)%'
    App\Export\Feed\Presentation\Controller\FeedRegenerateController:
        arguments:
            $topicBase: '%env(MERCURE_TOPIC_BASE)%'
    # CPDF-P3-01/P3-03 — catalog regeneration progress topic
    # (tenant/{tid}/catalogs/{id}/runs); built from the same public origin the
    # SPA subscribes on so the tenant-scoped subscribe claim matches. The manual
    # "Generuj teraz" endpoint returns the same topic as `mercure_topic`.
    App\Export\Catalog\Application\Async\CatalogProgressPublisher:
        arguments:
            $topicBase: '%env(MERCURE_TOPIC_BASE)%'
    App\Export\Catalog\Presentation\Controller\CatalogRegenerateController:
        arguments:
            $topicBase: '%env(MERCURE_TOPIC_BASE)%'
    # AUD-001 (#1573) — Catalog + permission publishers and the cookie
    # mint endpoint must build topics from the same public origin the SPA
    # subscribes on, so the tenant-scoped subscribe claim matches the
    # published topic exactly.
    App\Catalog\Application\Subscriber\MercurePublisher:
        arguments:
            $topicBase: '%env(MERCURE_TOPIC_BASE)%'
    App\Identity\Infrastructure\Mercure\PermissionInvalidationPublisher:
        arguments:
            $topicBase: '%env(MERCURE_TOPIC_BASE)%'
    App\Identity\Presentation\Controller\MercureAuthorizationController:
        arguments:
            $topicBase: '%env(MERCURE_TOPIC_BASE)%'

    # Bind the named Flysystem storage for the Asset uploader. Without
    # this Symfony has multiple FilesystemOperator services (one per
    # named storage) and autowire can't pick. The named alias
    # `assets.storage` is created by flysystem-bundle.
    App\Asset\Application\AssetUploader:
        arguments:
            $assetsStorage: '@assets.storage'

    # CPDF #2569/#2570 — the catalog PDF inliner reads asset bytes from the
    # named storage (same reason as the uploader: multiple FilesystemOperator
    # services, autowire can't pick) and is the AssetInliner seam impl.
    App\Asset\Infrastructure\Service\StorageAssetInliner:
        arguments:
            $assetsStorage: '@assets.storage'
    App\Asset\Contracts\Service\AssetInliner: '@App\Asset\Infrastructure\Service\StorageAssetInliner'

    # IMP-02 (#443) — rules-based mapping dictionary loader. Cached for
    # 5 min in `cache.app` (see MappingDictionaryService). The dictionary
    # path lives under config/ so it ships with the container and never
    # needs to be writeable at runtime.
    App\Import\Application\Service\MappingDictionaryService:
        arguments:
            $dictionaryPath: '%pim.imports.dictionary_path%'
            $cache: '@cache.app'

    # IMP-04 (#445) — async import worker. Bind named storage so the
    # handler can pull the uploaded source file without autowire
    # confusion (multiple FilesystemOperator services, one per named
    # storage).
    App\Import\Application\Handler\ImportRunHandler:
        arguments:
            $importsStorage: '@imports.storage'

    App\Import\Presentation\Controller\StartImportController:
        arguments:
            $importsStorage: '@imports.storage'

    # IMP2-2.2 — staged upload: stage once, reuse by id in dry-run/start.
    App\Import\Application\Service\StagedFileService:
        arguments:
            $importsStorage: '@imports.storage'

    # IMP2-1.12 — SSRF-safe HTTP client for image downloads. Wraps the default
    # client in Symfony's NoPrivateNetworkHttpClient, which validates the
    # ACTUALLY-connected peer IP on every progress tick AND every redirect hop
    # (closing the DNS-rebinding TOCTOU + redirect-to-private gaps that a
    # one-shot pre-resolution cannot). SsrfGuard stays as a cheap early reject.
    import.ssrf_safe_http_client:
        class: Symfony\Component\HttpClient\NoPrivateNetworkHttpClient
        arguments:
            - '@http_client'

    App\Import\Application\Handler\ImageDownloadHandler:
        arguments:
            $httpClient: '@import.ssrf_safe_http_client'
            $importsStorage: '@imports.storage'

    # APIC-P1-03 (ADR-0022) — SSRF-safe HTTP client for the API Configurator
    # consumer connector. Same NoPrivateNetworkHttpClient wrapper as imports:
    # per-redirect peer-IP validation backing the cheap SsrfGuard pre-filter.
    generic.ssrf_safe_http_client:
        class: Symfony\Component\HttpClient\NoPrivateNetworkHttpClient
        arguments:
            - '@http_client'

    App\Integration\Generic\Infrastructure\Http\GenericRestClient:
        arguments:
            $httpClient: '@generic.ssrf_safe_http_client'

    # GOLIVE #2131-2133 (deep audit) — webhook delivery POSTs to a
    # tenant-configured ApiProfile.webhookUrl. Without the SSRF wrapper a
    # tenant admin could point it at 169.254.169.254 (cloud metadata) or an
    # internal service (redis:6379, minio:9000) and use PIM as an SSRF pivot.
    # Same NoPrivateNetworkHttpClient wrapper as imports/generic: per-redirect
    # peer-IP validation, closing the DNS-rebinding TOCTOU gap.
    webhook.ssrf_safe_http_client:
        class: Symfony\Component\HttpClient\NoPrivateNetworkHttpClient
        arguments:
            - '@http_client'

    App\ApiConfigurator\Application\WebhookDeliveryClient:
        arguments:
            $http: '@webhook.ssrf_safe_http_client'

    # APIC-P1-09 — backoff policy needs the real blocking sleeper.
    App\Integration\Generic\Application\Sleeper:
        alias: App\Integration\Generic\Infrastructure\Http\RealSleeper

    # APIC-P2-03 — consumers that want resilience (pagination, sync) depend on
    # the RemoteRequester seam; bind it to the 429/503-retrying client.
    App\Integration\Generic\Infrastructure\Http\RemoteRequester:
        alias: App\Integration\Generic\Infrastructure\Http\BackoffRestClient

    App\Integration\Generic\Infrastructure\Http\Pagination\PaginationStrategies:
        arguments:
            $strategies: !tagged_iterator integration.pagination_strategy

    # EXP-06 (#585) — async export worker. Same named-storage binding so
    # the handler can write the generated XLSX/CSV to MinIO under
    # `<tenant_id>/<session_id>.<format>` (PRD §11.1).
    App\Export\Application\Async\ExportJobHandler:
        arguments:
            $exportsStorage: '@exports.storage'

    # XMLF-P4-01 — feed cache-and-serve storage. Same exports.storage MinIO
    # bucket under a dedicated `feeds/` prefix (regeneration writes here, the
    # XMLF-P3-05 public URL reads it back).
    App\Export\Feed\Infrastructure\Delivery\FlysystemFeedCacheStorage:
        arguments:
            $exportsStorage: '@exports.storage'

    # XMLF-P3-04/P3-05 — feed URL token HMAC. Keyed with the app secret so the
    # stored token_hash cannot be forged without the server key; the plaintext
    # token is shown once at mint/rotate and never persisted.
    App\Export\Feed\Application\Delivery\FeedTokenService:
        arguments:
            $secret: '%env(APP_SECRET)%'

    # CPDF-P3-02 — catalog PDF URL token HMAC. Keyed with the app secret so the
    # stored token_hash cannot be forged without the server key; the plaintext
    # token is shown once at mint/rotate and never persisted.
    App\Export\Catalog\Application\Delivery\CatalogTokenService:
        arguments:
            $secret: '%env(APP_SECRET)%'

    # XMLF-P3-06 [SEC] — the pull URL carries the feed credential in the path,
    # and the framework logs request paths (RouterListener route_parameters,
    # ErrorListener "No route found for …"). Decorating the single `logger`
    # service redacts the token in every record before it reaches stderr.
    App\Export\Feed\Infrastructure\Logging\FeedTokenRedactingLogger:
        decorates: 'logger'
        arguments:
            $inner: '@.inner'

    # EXP-08 (#587) — sessions controller streams the file back from
    # MinIO through PHP (no presigned URL in MVP).
    App\Export\Presentation\Controller\ExportSessionController:
        arguments:
            $exportsStorage: '@exports.storage'

    # AUD-019/020 (W1-7) — tenant offboarding purger. Bind all three named
    # storages so the prefix-delete cascade can sweep assets + imports +
    # exports under `<tenant-uuid>/` (autowire can't pick among the
    # per-storage FilesystemOperator services).
    App\Shared\Infrastructure\Maintenance\TenantPurger:
        arguments:
            $assetsStorage: '@assets.storage'
            $importsStorage: '@imports.storage'
            $exportsStorage: '@exports.storage'

    # VIEW-IMP-03 (#500) — health-check drivers for ImportSource. Only the
    # folder driver does a real probe in the MVP; sftp/ftp/http/webhook/
    # api/upload land with the polling daemon follow-up and use the
    # shared stub driver that simply returns "ok" with a note.
    # IMP2-2.8 (#1484) — folder-source containment: paths must resolve inside
    # IMPORT_SOURCE_BASE_PATH (anti directory-enumeration). Shared by the probe
    # driver and the ImportSource save validation.
    App\Import\Application\Service\HealthCheck\FolderPathGuard:
        arguments:
            $basePath: '%env(IMPORT_SOURCE_BASE_PATH)%'

    # AUD-050 (W2-11) — retention window injected from the bound parameter; the
    # `$exportsStorage` operator is the flysystem named alias (exports.storage).
    App\Export\Presentation\Command\CleanupExportsCommand:
        arguments:
            $freeRetentionDays: '%pim.export.free_retention_days%'

    # AUD-052 (W2-11) — `data_export` audit port. The Export controller writes
    # the audit entry through this Identity_Contracts interface (deptrac:
    # Export → Identity_Contracts); autowiring needs the explicit alias.
    App\Identity\Contracts\Audit\DataExportAuditor:
        alias: App\Identity\Infrastructure\Audit\DataExportAuditor

    # AGENT-P3-07 (#1967) — agent accountability entries in the same
    # append-only DH Auditor (resource_type=agent_run).
    App\Identity\Contracts\Audit\AgentActionAuditor:
        alias: App\Identity\Infrastructure\Audit\AgentActionAuditor

    # AUD-053 (W3-1) — "current user" port. Lets controllers outside Identity
    # (Backup; later the Import controllers) read the authenticated principal's
    # id/tenant without importing Identity\Domain\Entity\User (deptrac:
    # Backup/Import → Identity_Contracts). Impl name differs from the
    # interface, so autowiring needs the explicit alias.
    App\Identity\Contracts\Auth\CurrentUserProvider:
        alias: App\Identity\Application\Auth\SecurityCurrentUserProvider

    App\Import\Application\Service\HealthCheck\FolderHealthCheckDriver:
        tags: ['app.import.health_check_driver']

    App\Import\Application\Service\HealthCheck\StubHealthCheckDriver:
        arguments:
            $types:
                - !php/const App\Import\Domain\Enum\ImportSourceType::Sftp
                - !php/const App\Import\Domain\Enum\ImportSourceType::Ftp
                - !php/const App\Import\Domain\Enum\ImportSourceType::Http
                - !php/const App\Import\Domain\Enum\ImportSourceType::Webhook
                - !php/const App\Import\Domain\Enum\ImportSourceType::Api
                - !php/const App\Import\Domain\Enum\ImportSourceType::Upload
        tags: ['app.import.health_check_driver']

    App\Import\Application\Service\HealthCheckService:
        arguments:
            $drivers: !tagged_iterator app.import.health_check_driver

    # IMP-06 (#447) — production runs against the local pgBackRest
    # binary; tests + CI use a stub via `when@test` (see services
    # block at the bottom of this file in test environment).
    App\Backup\Application\Service\BackupRunnerInterface:
        alias: App\Backup\Infrastructure\Service\PgBackRestRunner

    # API Configurator (#90 / 0.10.1). Argon2id hasher + key generator
    # — see ADR-0016 for the format and algorithm choice. The generator
    # reads `kernel.environment` to embed the four-letter forensic
    # segment (`live`/`dev`/`test`) in the raw key.
    App\ApiConfigurator\Domain\Service\ApiKeyHasherInterface:
        alias: App\ApiConfigurator\Infrastructure\Security\Argon2idApiKeyHasher

    App\ApiConfigurator\Application\ApiKeyGenerator:
        arguments:
            $environment: '%kernel.environment%'

    # BYOK Anthropic encryption (#107 / 0.11.12, ADR-0017). The master
    # key map is split out as a parameter so rotation = bump env var +
    # add the version to this map. Existing rows keep decrypting with
    # their original version until lazy-reencrypted on next read.
    App\Shared\Infrastructure\Crypto\AesGcmEncryptionService:
        arguments:
            $rawKeysByVersion:
                1: '%env(default::APP_BYOK_KEY_V1)%'

    App\Shared\Application\Crypto\EncryptionServiceInterface:
        alias: App\Shared\Infrastructure\Crypto\AesGcmEncryptionService

    # API Configurator (#94 / 0.10.5). Decorator chain wraps the
    # default + #41 KindAware + #42 ContextScope builders. Priority
    # 20 keeps it on the outside so the public-read groups override
    # any admin-side context the inner builders set up.
    App\ApiConfigurator\Infrastructure\ApiPlatform\ApiProfileSerializerContextBuilder:
        decorates: 'api_platform.serializer.context_builder'
        decoration_priority: 20
        arguments:
            $decorated: '@.inner'

    # RBAC-P6-006 (#718) — surface #[RequiresPermission] / #[NoPermissionRequired]
    # on every API Platform OpenAPI operation as `x-cortex-permission`. The
    # decorator iterates the router once per spec export and matches
    # (path, method) against the inner factory's output. Integrators reading
    # `/api/docs.jsonopenapi` (or the versioned `docs/api-spec/v0.json`)
    # see the required permission per endpoint without cross-referencing
    # PRD §3.2 macierz uprawnień by hand.
    App\Identity\OpenApi\PermissionOpenApiFactory:
        decorates: 'api_platform.openapi.factory'
        arguments:
            $decorated: '@.inner'
            $router: '@router'

    # AUD-043 / AUD-054 (#1600) — lift the custom #[Route] controller surface
    # (~228 /api/* routes: auth, MFA, reset, invitations, bulk-edit, export,
    # import, assets, super-admin, RBAC) into the OpenAPI document. The inner
    # factory only documents resource-backed operations (31 paths), leaving the
    # hand-written controllers undocumented. Runs at priority 10 so it adds the
    # custom paths *before* PermissionOpenApiFactory (priority 0) annotates the
    # resource-backed operations with x-cortex-permission — both effects survive.
    App\Shared\OpenApi\CustomRouteOpenApiFactory:
        decorates: 'api_platform.openapi.factory'
        decoration_priority: 10
        arguments:
            $decorated: '@.inner'
            $router: '@router'

    # Idempotent CREATE EXTENSION IF NOT EXISTS ltree on every kernel boot.
    # Migrations create the extension, but Zenstruck Foundry's ResetDatabase
    # rebuilds the test schema from ORM metadata bypassing migrations —
    # without this listener LTREE columns explode at schema:update time.
    # Listening on console.command is what catches the schema:update call
    # that Foundry runs during database reset.
    App\Catalog\Infrastructure\Doctrine\EventListener\PostgresExtensionLoader:
        tags:
            - { name: kernel.event_listener, event: kernel.request, priority: 4096 }
            - { name: kernel.event_listener, event: console.command, priority: 4096 }

    # UI-08.4 (#259) — bind the modeling cache pool to the
    # form-schema handler + invalidator. Pool is declared in
    # cache.yaml; binding here so autowiring picks it up via the
    # `$modelingCache` argument name without manual @-references.
    App\Catalog\Application\Query\GetObjectFormSchema\GetObjectFormSchemaHandler:
        arguments:
            $modelingCache: '@pim.modeling_cache'

    App\Catalog\Application\Query\Usage\UsageQueryService:
        arguments:
            $modelingCache: '@pim.modeling_cache'

    App\Catalog\Infrastructure\Doctrine\EventListener\ObjectFormSchemaCacheInvalidator:
        arguments:
            $modelingCache: '@pim.modeling_cache'

    # RBAC-P2-006 (#655) — PermissionResolver consumes the dedicated
    # permissions_cache pool so tag-based invalidation does not collide
    # with the modeling cache namespace.
    # RBAC-P3-001 (#664) — runtime guard for #[RequiresPermission]. The
    # PHPStan rule from RBAC-P1-010 catches missing attributes at build
    # time; this listener is the defence-in-depth layer that throws in
    # dev when an unannotated /api/* endpoint sneaks through, and logs
    # a warning in prod (operator playbook: tail Loki for it).
    App\Identity\Infrastructure\Http\EndpointGuardListener:
        arguments:
            $environment: '%kernel.environment%'
            # strictMode stays `false` while ~130 controllers wait on
            # Phase 6 (#720-#722) to gain their RBAC attribute. Once the
            # PHPStan baseline reaches zero entries, flip this to `true`
            # (or expose as %env(bool:RBAC_GUARD_STRICT)% with prod=false,
            # dev=true) to throw on accidental future omissions.
            $strictMode: false

    App\Identity\Application\PermissionResolver:
        arguments:
            $cache: '@pim.permissions_cache'

    # RBAC-P5-021 (#711) — tenant lifecycle gating on every auth event.
    # Wraps Symfony's default UserChecker so user-level flags
    # (locked/expired/etc.) still trigger first; we add the tenant
    # status + soft-delete check on top. Wired to the `main` firewall
    # via security.yaml's `user_checker:` key.
    App\Identity\Infrastructure\Security\TenantUserChecker:
        arguments:
            $inner: '@security.user_checker'

when@test:
    parameters:
        pim.refresh_token.cookie_secure: false

    services:
        # Mercure hub override for tests (#47 / 0.4.7). The real `Hub`
        # would HTTP-POST to the Mercure container during PHPUnit runs;
        # the in-memory hub captures Update objects so subscribers
        # exercise the real flush → dispatch → publish pipeline without
        # the network. Production / dev keep the real hub.
        App\Tests\Support\InMemoryMercureHub:
            public: true
            autowire: false
            autoconfigure: false

        # Override the autowire alias `HubInterface` (which AP4's
        # mercure-bundle wires to `mercure.hub.default` in dev/prod) so
        # MercurePublisher's constructor receives the in-memory hub. We
        # leave `mercure.hub.default` itself alone so the real-Hub
        # service registration stays valid (env vars referenced by
        # mercure.yaml continue to be "used").
        Symfony\Component\Mercure\HubInterface:
            alias: App\Tests\Support\InMemoryMercureHub
            public: true

        # IMP-06 (#447) — keep the pgbackrest CLI off the test box.
        # The stub honours the same contract so the handler flow
        # (mark running → run → mark completed/failed) is exercised
        # end-to-end through the messenger bus.
        App\Tests\Support\InMemoryBackupRunner:
            public: true
            autowire: false
            autoconfigure: false

        App\Backup\Application\Service\BackupRunnerInterface:
            alias: App\Tests\Support\InMemoryBackupRunner
            public: true

        # AGENT-P0-03 (#1946) — the pending-changes port has no runtime
        # consumer until the agent tools land (epic 0.7 M3), so the compiled
        # container would remove/inline it; integration tests fetch it
        # directly from the container.
        App\Catalog\Contracts\PendingChanges\PendingChangesPort:
            alias: App\Catalog\Application\PendingChanges\PendingChangesService
            public: true

        # AGENT-P2-01 (#1958) — same story: the grounding port's consumer
        # chain (tool -> registry -> loop) is not merged in full yet, so
        # the compiled container would remove it; tests fetch it directly.
        App\Search\Contracts\CatalogQueryPort:
            alias: App\Search\Application\AgentCatalogQueryAdapter
            public: true

        # AGENT-P2-03 (#1960) — same story for the completeness report port.
        App\Catalog\Contracts\Query\CompletenessReportPort:
            alias: App\Catalog\Application\Query\SqlCompletenessReport
            public: true

        # AGENT-P3-01/02 (#1961/#1962) — and the value-edit + commit ports.
        App\Catalog\Contracts\Command\BulkEditValuesPort:
            alias: App\Catalog\Application\PendingChanges\BulkEditValuesMaterializer
            public: true

        App\Catalog\Contracts\Command\PendingBatchCommitPort:
            alias: App\Catalog\Application\PendingChanges\PendingBatchCommitter
            public: true

        # AGENT-P3-04 (#1964) — and the rollback port.
        App\Catalog\Contracts\Command\BulkRollbackPort:
            alias: App\Catalog\Application\PendingChanges\ObjectValueRollbackHandler
            public: true

        # AGENT-P3-05 (#1965) — and the category-assignment port.
        App\Catalog\Contracts\Command\AssignCategoriesPort:
            alias: App\Catalog\Application\PendingChanges\AssignCategoriesMaterializer
            public: true

        # AGENT-P3-06 (#1966) — and the export trigger port.
        App\Export\Contracts\ExportTriggerPort:
            alias: App\Export\Application\AgentExportTrigger
            public: true

        # AGENT-P5-01 (#1970) — and the schema commit port.
        App\Import\Contracts\SchemaImportPort:
            alias: App\Import\Application\Service\AgentSchemaImportApplier
            public: true

        # AGENT-P7-01 (#1981) — and the feed assist port.
        App\Export\Contracts\FeedAssistPort:
            alias: App\Export\Feed\Application\AgentFeedAssist
            public: true

        # AGENT-P8-02 (#1984) — and the column-mapping port.
        App\Import\Contracts\ColumnMappingPort:
            alias: App\Import\Application\Service\AgentColumnMappingAssist
            public: true
