# AGENT-P0-09 (#1952) — the ENTIRE DI surface of the removable Agent BC
# (ADR-0024 a). This file is imported from services.yaml with
# `ignore_errors: not_found`, and the main `App\:` discovery excludes
# `../src/Agent/` — so deleting `src/Agent/` together with THIS file
# leaves a compiling container with zero agent references. The CI job
# `agent-removability` enforces exactly that.

parameters:
    # AGENT-P0-06 (#1949) — agent LLM models per tool kind (ADR-0024 b):
    # schema-ops (bigger blast radius) run on the Opus-tier model, all
    # other kinds on the Sonnet-tier default. A model bump is a config
    # change, not a code change. Retries are bounded (SDK honours
    # retry-after, exponential fallback); exhaustion -> run error.
    pim.agent.model.default: '%env(default:pim.agent.model.default.fallback:AGENT_MODEL_DEFAULT)%'
    pim.agent.model.default.fallback: 'claude-sonnet-4-6'
    pim.agent.model.schema: '%env(default:pim.agent.model.schema.fallback:AGENT_MODEL_SCHEMA)%'
    pim.agent.model.schema.fallback: 'claude-opus-4-8'
    pim.agent.llm.max_retries: 4
    pim.agent.llm.timeout_seconds: 120.0
    # Interactive orchestration fails fast; long-running content generation
    # continues to use the background defaults above.
    pim.agent.llm.interactive_max_tokens: 1024
    pim.agent.llm.interactive_max_retries: 1
    pim.agent.llm.interactive_timeout_seconds: 45.0

    # AGENT-P0-08 (#1951) — global agent feature flag; per-tenant
    # availability additionally requires an active BYOK key.
    pim.agent.enabled: '%env(bool:AGENT_ENABLED)%'

    # AGENT-P1-03 (#1955) — in-run hard limits (PRD 10.4 / architecture
    # 8.5 subset enforced inside the loop; hourly/daily/monthly budgets
    # + kill-switch land in P1-04) and per-MTok USD pricing per model
    # tier (cost accounting on agent_runs).
    pim.agent.limits.tool_calls_per_run: 10
    pim.agent.limits.tokens_per_run: 100000
    pim.agent.pricing.default_input_per_mtok: 3.0
    pim.agent.pricing.default_output_per_mtok: 15.0
    pim.agent.pricing.schema_input_per_mtok: 5.0
    pim.agent.pricing.schema_output_per_mtok: 25.0

    # AGENT-P1-04 (#1956) — 8.5 budgets; windows are UTC (day/month) and
    # sliding (hour). Exceeding a window IS the kill-switch: refusals
    # last until the window rolls over (midnight UTC / month end).
    pim.agent.limits.tool_calls_per_hour_per_user: 50
    pim.agent.limits.tokens_per_day_per_user: 500000
    pim.agent.limits.cost_per_day_per_tenant_usd: 20.0
    pim.agent.limits.cost_per_month_per_tenant_usd: 300.0

services:
    _defaults:
        autowire: true
        autoconfigure: true

    _instanceof:
        # AGENT-P0-07 (#1950) — every AgentToolInterface implementation is
        # auto-registered in the ToolRegistry (ADR-0024 b: adding a tool =
        # adding a service, zero loop changes).
        App\Agent\Application\Tool\AgentToolInterface:
            tags: ['agent.tool']

    # PSR-4 discovery of the agent module lives HERE (the main
    # services.yaml excludes ../src/Agent/) so the module has exactly one
    # DI root that disappears with it.
    App\Agent\:
        resource: '../src/Agent/'
        exclude:
            # AGENT-P1-01 (#1953) — module-namespace migrations
            # (AgentMigrations\*) are not App\Agent\* classes.
            - '../src/Agent/Infrastructure/Migrations/'
            # AGENT-P4-01 (#1968) — test-only LLM stand-in; excluded so the
            # SDK client stays the single AgentLlmClientInterface
            # implementation outside when@test.
            - '../src/Agent/Infrastructure/Testing/'

    # AGENT-P0-06 (#1949) — Anthropic client on the tenant's BYOK key;
    # scalar knobs are not autowired.
    App\Agent\Infrastructure\Anthropic\AnthropicClientFactory:
        arguments:
            $maxRetries: '%pim.agent.llm.max_retries%'
            $timeoutSeconds: '%pim.agent.llm.timeout_seconds%'

    App\Agent\Infrastructure\Anthropic\SdkAgentLlmClient:
        arguments:
            $interactiveMaxTokens: '%pim.agent.llm.interactive_max_tokens%'
            $interactiveMaxRetries: '%pim.agent.llm.interactive_max_retries%'
            $interactiveTimeoutSeconds: '%pim.agent.llm.interactive_timeout_seconds%'

    App\Agent\Infrastructure\Anthropic\AgentModelSelector:
        arguments:
            $defaultModel: '%pim.agent.model.default%'
            $schemaModel: '%pim.agent.model.schema%'

    # AGENT-P0-08 (#1951) — global flag + per-tenant BYOK availability.
    App\Agent\Application\AgentFeatureGuard:
        arguments:
            $agentEnabled: '%pim.agent.enabled%'

    # AGENT-P1-05 (#1957) — agent run SSE topics (tenant-scoped, private).
    App\Agent\Application\Run\AgentProgressPublisher:
        arguments:
            $topicBase: '%env(MERCURE_TOPIC_BASE)%'

    # AGENT-P9-02 (#1989) — cost aggregator uses the same §8.5 caps the
    # limit guard enforces (P1-04 knobs).
    App\Agent\Application\Cost\AgentCostAggregator:
        arguments:
            $dayCapUsd: '%pim.agent.limits.cost_per_day_per_tenant_usd%'
            $monthCapUsd: '%pim.agent.limits.cost_per_month_per_tenant_usd%'

    # AGENT-P1-03 (#1955) — loop limits + cost accounting knobs.
    App\Agent\Application\Run\AgentLoopRunner:
        arguments:
            $maxToolCallsPerRun: '%pim.agent.limits.tool_calls_per_run%'
            $maxTokensPerRun: '%pim.agent.limits.tokens_per_run%'

    # AGENT-P1-04 (#1956) — 8.5 budget guard knobs.
    App\Agent\Application\Limits\AgentLimitGuard:
        arguments:
            $toolCallsPerHourPerUser: '%pim.agent.limits.tool_calls_per_hour_per_user%'
            $tokensPerDayPerUser: '%pim.agent.limits.tokens_per_day_per_user%'
            $costPerDayPerTenantUsd: '%pim.agent.limits.cost_per_day_per_tenant_usd%'
            $costPerMonthPerTenantUsd: '%pim.agent.limits.cost_per_month_per_tenant_usd%'

    App\Agent\Application\Run\UsageCostCalculator:
        arguments:
            $defaultInputPerMtok: '%pim.agent.pricing.default_input_per_mtok%'
            $defaultOutputPerMtok: '%pim.agent.pricing.default_output_per_mtok%'
            $schemaInputPerMtok: '%pim.agent.pricing.schema_input_per_mtok%'
            $schemaOutputPerMtok: '%pim.agent.pricing.schema_output_per_mtok%'

when@test:
    services:
        # AGENT-P3-02 (#1962) — approval gate under integration test.
        test.agent.approval:
            alias: App\Agent\Application\Approval\AgentApprovalService
            public: true

        # AGENT-P8-01 (#1983) — proactive scanner under integration test.
        test.agent.proactive:
            alias: App\Agent\Application\Proactive\ProactiveStewardScanner
            public: true

        # AGENT-P4-01 (#1968) — the API suite runs the loop inline
        # (sync transports); a canned LLM keeps it deterministic and
        # offline.
        App\Agent\Infrastructure\Testing\CannedAgentLlmClient: ~
        App\Agent\Application\Llm\AgentLlmClientInterface:
            alias: App\Agent\Infrastructure\Testing\CannedAgentLlmClient
