# Architectural fitness rules for the modular monolith — see ADR-0013.
#
# Each BC is split into two layers — Internals (Domain + Application +
# Infrastructure + Presentation) and Contracts (the public DTOs/events
# everyone outside the BC is allowed to reach for). Cross-BC depends_on
# only goes through the *_Contracts layer; Internals are private.
#
# Tooling-only directories (Benchmark, DataFixtures, Story) live in their
# own layer that is allowed to reach into anything — fixtures and the
# bulk-import benchmark legitimately do.
parameters:
    paths:
        - src
    exclude_files:
        - '#src/Kernel\.php#'
    layers:
        # ─── Catalog ───────────────────────────────────────────────────
        # AUD-ARCH-001 (#3022): Domain is a separate fitness boundary so
        # Infrastructure libraries can be forbidden there while remaining
        # available to Catalog adapters and presentation/application code.
        - name: Catalog_Domain
          collectors:
              - type: directory
                value: 'src/Catalog/Domain/.*'
        - name: Catalog_Internals
          collectors:
              - type: directory
                value: 'src/Catalog/Application/.*'
              - type: directory
                value: 'src/Catalog/Infrastructure/.*'
              - type: directory
                value: 'src/Catalog/Presentation/.*'
        - name: Catalog_Contracts
          collectors:
              - type: directory
                value: 'src/Catalog/Contracts/.*'

        # ─── Channel ───────────────────────────────────────────────────
        - name: Channel_Internals
          collectors:
              - type: directory
                value: 'src/Channel/Domain/.*'
              - type: directory
                value: 'src/Channel/Application/.*'
              - type: directory
                value: 'src/Channel/Infrastructure/.*'
              - type: directory
                value: 'src/Channel/Presentation/.*'
        - name: Channel_Contracts
          collectors:
              - type: directory
                value: 'src/Channel/Contracts/.*'

        # ─── Asset ─────────────────────────────────────────────────────
        - name: Asset_Internals
          collectors:
              - type: directory
                value: 'src/Asset/Domain/.*'
              - type: directory
                value: 'src/Asset/Application/.*'
              - type: directory
                value: 'src/Asset/Infrastructure/.*'
              - type: directory
                value: 'src/Asset/Presentation/.*'
        - name: Asset_Contracts
          collectors:
              - type: directory
                value: 'src/Asset/Contracts/.*'

        # ─── Identity ──────────────────────────────────────────────────
        - name: Identity_Internals
          collectors:
              - type: directory
                value: 'src/Identity/Domain/.*'
              # AUD-053 (W3-1): all of Identity\Application EXCEPT the
              # carved-out CurrentTenantProvider, which lives in its own
              # single-class layer so Search can reach it without the whole
              # Internals surface. A token may only live in one layer.
              - type: bool
                must:
                    - type: directory
                      value: 'src/Identity/Application/.*'
                must_not:
                    - type: classNameRegex
                      value: '#^App\\Identity\\Application\\CurrentTenantProvider$#'
              - type: directory
                value: 'src/Identity/Infrastructure/.*'
              - type: directory
                value: 'src/Identity/Presentation/.*'
              # AUD-053 (W3-1): the OpenApi factory was unassigned to any
              # layer (deptrac debug:unassigned). It is an Identity-internal
              # API Platform decorator; fold it into the Internals layer so
              # every first-party Identity class is governed.
              - type: directory
                value: 'src/Identity/OpenApi/.*'
        # AUD-053 (W3-1): a single-class sub-layer carved out of Identity so
        # other BCs (Search) can reach the tenant resolver WITHOUT being
        # granted the whole Identity_Internals surface. CurrentTenantProvider
        # reads the security token (authenticated user / API-key principal /
        # non-prod env default) — the security-backed source the cross-tenant
        # search guard needs. The pending cleanup is moving it into
        # Shared\Application (see the RequestTenantSubscriber baseline note);
        # until then this is the minimum honest grant, not a broad allow.
        - name: Identity_TenantProvider
          collectors:
              - type: classNameRegex
                value: '#^App\\Identity\\Application\\CurrentTenantProvider$#'
        - name: Identity_Contracts
          collectors:
              - type: directory
                value: 'src/Identity/Contracts/.*'

        # ─── Shared (always reachable) ─────────────────────────────────
        - name: Shared
          collectors:
              - type: directory
                value: 'src/Shared/.*'

        # ─── Search (Meilisearch adapter — epic 0.5) ───────────────────
        # Search splits off a Contracts seam (ADR-0024, AGENT-P0-02): agent
        # read-tools query the catalog only through src/Search/Contracts.
        - name: Search
          collectors:
              - type: bool
                must:
                    - type: directory
                      value: 'src/Search/.*'
                must_not:
                    - type: directory
                      value: 'src/Search/Contracts/.*'
        - name: Search_Contracts
          collectors:
              - type: directory
                value: 'src/Search/Contracts/.*'

        # ─── Backup (pgBackRest snapshots — IMP-06) ────────────────────
        # AUD-079 (W3-1): the Backup BC shipped without any deptrac rules,
        # so all 12 of its classes were unassigned (debug:unassigned) and
        # every reach INTO it (ImportSession.backupSnapshot, BackupVoter)
        # was an unreported uncovered edge. Split it like every other BC —
        # Internals + a forward-compatible Contracts layer.
        - name: Backup_Internals
          collectors:
              - type: directory
                value: 'src/Backup/Domain/.*'
              - type: directory
                value: 'src/Backup/Application/.*'
              - type: directory
                value: 'src/Backup/Infrastructure/.*'
              - type: directory
                value: 'src/Backup/Presentation/.*'
        - name: Backup_Contracts
          collectors:
              - type: directory
                value: 'src/Backup/Contracts/.*'

        # ─── Integration (consumer connectors — ADR-0022, epic APIC) ───
        # The generic REST/JSON connector lives in its own sub-context with the
        # standard Internals + Contracts split (cross-BC only through Contracts).
        # The parent Integration layer keeps any future top-level / per-bundle
        # code (BaseLinker, Shopify) governed until those add their own layers.
        - name: Integration
          collectors:
              - type: bool
                must:
                    - type: directory
                      value: 'src/Integration/.*'
                must_not:
                    - type: directory
                      value: 'src/Integration/Generic/.*'
                    - type: directory
                      value: 'src/Integration/Contracts/.*'
        # AGENT-P7-02 (#1982) — the cross-BC seam future connectors
        # (BaseLinker 0.8, Shopify 0.9) implement; the Agent BC may only
        # reach Integration through it.
        - name: Integration_Contracts
          collectors:
              - type: directory
                value: 'src/Integration/Contracts/.*'
        - name: Integration_Generic_Internals
          collectors:
              - type: directory
                value: 'src/Integration/Generic/Domain/.*'
              - type: directory
                value: 'src/Integration/Generic/Application/.*'
              - type: directory
                value: 'src/Integration/Generic/Infrastructure/.*'
              - type: directory
                value: 'src/Integration/Generic/Presentation/.*'
        - name: Integration_Generic_Contracts
          collectors:
              - type: directory
                value: 'src/Integration/Generic/Contracts/.*'
        # ─── Agent (removable BC — ADR-0024, epic 0.7) ─────────────────
        # The agent is a fully removable bounded context (open-core): no
        # other ruleset may list Agent_Internals/Agent_Contracts, so any
        # core->Agent import fails closed. Agent_Internals reaches host
        # engines exclusively through their *_Contracts seams.
        - name: Agent_Internals
          collectors:
              - type: bool
                must:
                    - type: directory
                      value: 'src/Agent/.*'
                    # #2736 — the Doctrine migrations under
                    # src/Agent/Infrastructure/Migrations live in the
                    # `AgentMigrations\` namespace, not `App\`, so the Vendor
                    # catch-all ("anything not under App\") claimed them too
                    # and deptrac warned they were in two layers at once.
                    # Layer assignment must be deterministic here of all
                    # places: ADR-0024 makes the Agent boundary fail-closed.
                    - type: classNameRegex
                      value: '#^App\\Agent\\#'
                must_not:
                    - type: directory
                      value: 'src/Agent/Contracts/.*'
        - name: Agent_Contracts
          collectors:
              - type: directory
                value: 'src/Agent/Contracts/.*'
        - name: ApiConfigurator
          collectors:
              - type: directory
                value: 'src/ApiConfigurator/.*'

        # ─── Dashboard (ADR-0026, DASH-04 #2255) ───────────────────────
        # Thin read-only aggregate context for the admin dashboard. Reads
        # other BCs via their Contracts seams; tables without a seam are
        # read with raw tenant-scoped DBAL SQL (policy in ADR-0026), so no
        # *_Internals dependency is allowed here.
        - name: Dashboard
          collectors:
              - type: directory
                value: 'src/Dashboard/.*'

        # ─── Vendor (third-party + PHP-internal classes) ───────────────
        # Doctrine is carved out so Catalog_Domain can forbid it explicitly.
        # Other layers opt in below exactly as they previously did through the
        # broad Vendor bucket.
        - name: Doctrine
          collectors:
              - type: classNameRegex
                value: '#^Doctrine\\#'
        # AUD-053 (W3-1): every dependency from a first-party class onto a
        # framework/library/PHP-internal class (Symfony, API
        # Platform, PSR, …) was previously counted as "Uncovered" — ~5.3k
        # silent edges that hid the handful of REAL first-party gaps among
        # them. This catch-all assigns "anything not under App\" to a named
        # Vendor layer that every BC is explicitly allowed to use, so the
        # uncovered count collapses to genuine first-party blind spots only.
        - name: Vendor
          collectors:
              - type: bool
                must_not:
                    - type: classNameRegex
                      value: '#^App\\#'
                    - type: classNameRegex
                      value: '#^Doctrine\\#'

        # ─── Import / Export (ADR-0019, IMP2-1.1 #1463) ────────────────
        # Target ruleset: only *_Contracts + Shared. Existing reaches into
        # Catalog_Internals are baselined below; the remaining burndown is
        # tracked by #2736 (#1466 is closed).
        # Import splits off a Contracts seam (ADR-0024, AGENT-P0-02): agent
        # tools reach the import engine (StructuralImport, AutoMapper) only
        # through src/Import/Contracts.
        - name: Import
          collectors:
              - type: bool
                must:
                    - type: directory
                      value: 'src/Import/.*'
                must_not:
                    - type: directory
                      value: 'src/Import/Contracts/.*'
        - name: Import_Contracts
          collectors:
              - type: directory
                value: 'src/Import/Contracts/.*'
        # ─── Export core + Feed / Catalog sub-areas (ADR-0023 XMLF, ADR-0027 CPDF) ─
        # Feed (src/Export/Feed) and Catalog (src/Export/Catalog) are sub-areas of
        # the Export BC: each may reach the whole Export core (ExportBuilder reuse)
        # and the Export_Contracts seam (e.g. the PdfRenderer port), but talks to
        # other BCs (Channel/Catalog/Asset) only through their *_Contracts. Core
        # Export must NOT reach Feed or Catalog.
        - name: Export
          collectors:
              - type: bool
                must:
                    - type: directory
                      value: 'src/Export/.*'
                must_not:
                    - type: directory
                      value: 'src/Export/Feed/.*'
                    - type: directory
                      value: 'src/Export/Catalog/.*'
                    - type: directory
                      value: 'src/Export/Contracts/.*'
        - name: Export_Contracts
          collectors:
              - type: directory
                value: 'src/Export/Contracts/.*'
        - name: Export_Feed_Internals
          collectors:
              - type: directory
                value: 'src/Export/Feed/Domain/.*'
              - type: directory
                value: 'src/Export/Feed/Application/.*'
              - type: directory
                value: 'src/Export/Feed/Infrastructure/.*'
              - type: directory
                value: 'src/Export/Feed/Presentation/.*'
        - name: Export_Feed_Contracts
          collectors:
              - type: directory
                value: 'src/Export/Feed/Contracts/.*'
        - name: Export_Catalog_Internals
          collectors:
              - type: directory
                value: 'src/Export/Catalog/Domain/.*'
              - type: directory
                value: 'src/Export/Catalog/Application/.*'
              - type: directory
                value: 'src/Export/Catalog/Infrastructure/.*'
              - type: directory
                value: 'src/Export/Catalog/Presentation/.*'
        - name: Export_Catalog_Contracts
          collectors:
              - type: directory
                value: 'src/Export/Catalog/Contracts/.*'

        # ─── Notification — persistent in-app notifications (WFL-P2-02) ───
        - name: Notification_Internals
          collectors:
              - type: directory
                value: 'src/Notification/Domain/.*'
              - type: directory
                value: 'src/Notification/Application/.*'
              - type: directory
                value: 'src/Notification/Infrastructure/.*'
              - type: directory
                value: 'src/Notification/Presentation/.*'
        - name: Notification_Contracts
          collectors:
              - type: directory
                value: 'src/Notification/Contracts/.*'

        # ─── Workflow — editorial state machine, transition log, tasks (ADR-0029) ───
        - name: Workflow_Internals
          collectors:
              - type: directory
                value: 'src/Workflow/Domain/.*'
              - type: directory
                value: 'src/Workflow/Application/.*'
              - type: directory
                value: 'src/Workflow/Infrastructure/.*'
              - type: directory
                value: 'src/Workflow/Presentation/.*'
        - name: Workflow_Contracts
          collectors:
              - type: directory
                value: 'src/Workflow/Contracts/.*'

        # ─── Tooling — fixtures, benchmarks, foundry stories, PHPStan rules ───
        - name: Tooling
          collectors:
              - type: directory
                value: 'src/Benchmark/.*'
              - type: directory
                value: 'src/DataFixtures/.*'
              - type: directory
                value: 'src/Story/.*'
              # RBAC-P1-010 (#649) — custom PHPStan rules. They reach
              # into Identity attribute classes to detect their presence
              # at static-analysis time; legitimate tooling cross-cut.
              - type: directory
                value: 'src/PHPStan/.*'

    ruleset:
        # AUD-053 (W3-1): `Vendor` and the carved-out `Doctrine` layer appear
        # in every ruleset except Catalog_Domain so framework/library edges
        # stay covered without allowing persistence into that domain layer.

        # ADR-0026 (DASH-04 #2255) — read-only dashboard aggregates. Only
        # Contracts seams + Shared; cross-BC data without a seam is read
        # via raw tenant-scoped SQL, never via *_Internals classes.
        Dashboard:
            - Catalog_Contracts
            - Channel_Contracts
            - Identity_Contracts
            - Shared
            - Doctrine
            - Vendor

        Catalog_Domain:
            - Catalog_Contracts
            - Shared
            - Vendor

        Catalog_Internals:
            - Catalog_Domain
            - Catalog_Contracts
            - Asset_Contracts
            - Channel_Contracts
            - Identity_Contracts
            # ADR-0029 — PATCH status resolves transitions against the
            # object_editorial state machine; vocabulary via Workflow seam.
            - Workflow_Contracts
            - Shared
            - Doctrine
            - Vendor
        Catalog_Contracts:
            - Shared
            - Doctrine
            - Vendor

        # ADR-0029 — Workflow BC reaches Catalog/Identity only via seams;
        # marking lives on CatalogObject, so Catalog_Internals may read the
        # Workflow_Contracts vocabulary (transition names) and, from WFL-P1-*,
        # Identity voters consult Workflow ports the same way.
        Workflow_Internals:
            - Workflow_Contracts
            - Catalog_Contracts
            - Identity_Contracts
            # WFL-P4-02 — task automation emits task_assigned notifications
            # through the Notification seam.
            - Notification_Contracts
            - Shared
            - Doctrine
            - Vendor
        Workflow_Contracts:
            - Shared
            - Doctrine
            - Vendor

        # WFL-P2-02 — thin notification context (Dashboard precedent):
        # consumes Catalog Contracts events, resolves recipients via the
        # Identity seam and reads submit authorship via the Workflow seam.
        Notification_Internals:
            - Notification_Contracts
            - Catalog_Contracts
            - Identity_Contracts
            - Workflow_Contracts
            - Shared
            - Doctrine
            - Vendor
        Notification_Contracts:
            - Shared
            - Doctrine
            - Vendor

        Channel_Internals:
            - Channel_Contracts
            - Catalog_Contracts
            - Asset_Contracts
            - Identity_Contracts
            - Shared
            - Doctrine
            - Vendor
        Channel_Contracts:
            - Shared
            - Doctrine
            - Vendor

        Asset_Internals:
            - Asset_Contracts
            - Catalog_Contracts
            - Identity_Contracts
            - Shared
            - Doctrine
            - Vendor
        Asset_Contracts:
            - Shared
            - Doctrine
            - Vendor

        Import:
            - Import_Contracts
            - Catalog_Contracts
            - Channel_Contracts
            - Asset_Contracts
            - Identity_Contracts
            # AUD-079 (W3-1): ImportSession carries a `backupSnapshot`
            # many-to-one onto the Backup entity (IMP2-2.10 pre-import
            # snapshot badge). A Doctrine association needs the concrete
            # target-entity class, so this is a structural coupling that
            # cannot be hidden behind a Contracts interface; allow it
            # explicitly rather than baseline it as a violation.
            - Backup_Internals
            - Shared
            - Doctrine
            - Vendor
        Import_Contracts:
            - Shared
            - Doctrine
            - Vendor
        Export:
            - Export_Contracts
            - Catalog_Contracts
            - Channel_Contracts
            - Asset_Contracts
            - Identity_Contracts
            - Shared
            - Doctrine
            - Vendor
        Export_Contracts:
            - Shared
            - Doctrine
            - Vendor
        Export_Feed_Internals:
            - Export
            - Export_Contracts
            - Export_Feed_Contracts
            - Catalog_Contracts
            - Channel_Contracts
            - Asset_Contracts
            - Identity_Contracts
            - Shared
            - Doctrine
            - Vendor
        Export_Feed_Contracts:
            - Shared
            - Doctrine
            - Vendor
        Export_Catalog_Internals:
            - Export
            - Export_Contracts
            - Export_Catalog_Contracts
            - Catalog_Contracts
            - Channel_Contracts
            - Asset_Contracts
            - Identity_Contracts
            - Shared
            - Doctrine
            - Vendor
        Export_Catalog_Contracts:
            - Shared
            - Doctrine
            - Vendor

        Identity_Internals:
            - Identity_Contracts
            - Catalog_Contracts
            # ADR-0029 — workflow-state guards/voters consult Workflow seam
            # (WFL-P1-01/P1-02).
            - Workflow_Contracts
            # AUD-079 (W3-1): BackupVoter references the Backup entity it
            # protects — the same "voter references its resource" pattern
            # already accepted for ProductVoter / CategoryVoter / AssetVoter.
            - Backup_Internals
            # AUD-053 (W3-1): CurrentTenantProvider was carved out of this
            # layer; the audit listeners that still consume it reach back in
            # through its dedicated single-class layer.
            - Identity_TenantProvider
            - Shared
            - Doctrine
            - Vendor
        Identity_TenantProvider:
            - Shared
            - Doctrine
            - Vendor
        Identity_Contracts:
            - Shared
            - Doctrine
            - Vendor

        Shared:
            # Shared is normally a leaf. The exception is the RBAC attribute
            # contract — MetricsController carries #[NoPermissionRequired]
            # so the EndpointGuardListener can let the Prometheus scrape
            # through without RBAC. Identity_Contracts holds only the two
            # attribute classes (RequiresPermission + NoPermissionRequired),
            # which are pure metadata with zero runtime coupling.
            - Identity_Contracts
            - Doctrine
            - Vendor

        Search:
            - Search_Contracts
            - Shared
            - Catalog_Contracts
            - Catalog_Internals
            - Catalog_Domain
            - Channel_Contracts
            - Identity_Contracts
            # AUD-079 (W3-1): narrowed from the whole Identity_Internals to
            # the single CurrentTenantProvider class the search tenant guard
            # actually uses (debug: it touches nothing else in Identity
            # Internals).
            - Identity_TenantProvider
            - Doctrine
            - Vendor
        Search_Contracts:
            - Shared
            - Doctrine
            - Vendor

        Backup_Internals:
            - Backup_Contracts
            # AUD-079 (W3-1): Backup's only cross-BC reach is the current-user
            # port (CurrentUserProvider in Identity_Contracts) plus Shared —
            # the User-entity leak was removed via that seam in W3-1.
            - Identity_Contracts
            - Shared
            - Doctrine
            - Vendor
        Backup_Contracts:
            - Shared
            - Doctrine
            - Vendor

        Integration:
            - Integration_Contracts
            - Shared
            - Catalog_Contracts
            - Channel_Contracts
            - Asset_Contracts
            - Identity_Contracts
            - Doctrine
            - Vendor

        Integration_Contracts:
            - Shared
            - Doctrine
            - Vendor

        Integration_Generic_Internals:
            - Integration_Generic_Contracts
            - Shared
            - Catalog_Contracts
            - Channel_Contracts
            - Asset_Contracts
            - Identity_Contracts
            - Doctrine
            - Vendor
        Integration_Generic_Contracts:
            - Shared
            - Doctrine
            - Vendor

        # ADR-0024: Agent_Internals sees engine Contracts seams only — never
        # any *_Internals. Nothing else lists Agent_* (removability is
        # fail-closed: an import of App\Agent\* from core is a violation).
        Agent_Internals:
            - Agent_Contracts
            - Shared
            - Catalog_Contracts
            - Channel_Contracts
            - Asset_Contracts
            - Identity_Contracts
            - Export_Contracts
            - Search_Contracts
            - Import_Contracts
            - Integration_Contracts
            - Doctrine
            - Vendor
        Agent_Contracts:
            - Shared
            - Doctrine
            - Vendor

        ApiConfigurator:
            - Shared
            - Catalog_Contracts
            - Channel_Contracts
            - Asset_Contracts
            - Identity_Contracts
            - Doctrine
            - Vendor

        Tooling:
            - Catalog_Internals
            - Catalog_Domain
            - Catalog_Contracts
            - Channel_Internals
            - Channel_Contracts
            - Asset_Internals
            - Asset_Contracts
            - Identity_Internals
            - Identity_Contracts
            - Shared
            - Import
            - Export
            # CPDF P6-04 (#2440) — CatalogPdfBenchmarkCommand drives the real
            # render pipeline (CatalogRenderService, template catalog, Dompdf)
            # to measure production-shaped memory/time; same legitimate
            # tooling cross-cut as Catalog_Internals above.
            - Export_Contracts
            - Export_Catalog_Internals
            - Export_Catalog_Contracts
            - Doctrine
            - Vendor

        # Agent migrations use a non-App namespace and therefore belong to
        # the Vendor catch-all. Preserve their existing Doctrine access after
        # carving Doctrine into its own fitness layer.
        Vendor:
            - Doctrine

    # Inline baseline of pre-existing cross-BC violations that the cleanup
    # tickets handle in follow-ups (see ADR-0013). Three clusters:
    #   1. Catalog\Domain enums (ObjectKind / AttributeType / Provenance)
    #      used by Catalog Contracts + Channel validator. Move them into
    #      Catalog\Contracts\Enum next.
    #   2. Shared\Infrastructure\Http\RequestTenantSubscriber depending on
    #      Identity\Application\CurrentTenantProvider. Cleanup: move
    #      CurrentTenantProvider into Shared\Application.
    # Every entry below is a TODO; new violations not in this list fail the
    # build through CI.
    #
    # AUD-053 (W3-1) burndown — the dominant cluster here was the repeated
    # `Identity\Domain\Entity\User` leak: ~17 controllers reached for the
    # concrete User entity just to read the authenticated principal's id /
    # tenant off the security token. W3-1 introduced the seam
    # `Identity\Contracts\Auth\CurrentUserProvider` and migrated the first
    # batch off it (Backup TriggerBackupController + 4 Import controllers:
    # ImportReportCsv, ImportThroughput, ListScheduleRuns, UpcomingSchedules).
    # #2736 migrated the second batch — 10 more Import controllers
    # (GetImportSession, ImportSessionState, ListImportSessions, ParsePreview,
    # RollbackImport, ScheduleState, StartStructuralImport,
    # TestImportSourceConnection, DuplicateImportProfile, ExportImportProfile)
    # — deleting their entries below.
    #
    # WHAT REMAINS (tracked by #2736, NOT by the closed #1466):
    #   - 7 User-leak entries in API Platform state processors + the three
    #     controllers whose User reach is entangled with other Catalog reaches
    #     (ImportImportProfile, StartImport, ValidateDryRun) — same mechanical
    #     migration, kept out of #2736 to keep the diff reviewable.
    #   - the remaining Export/Import -> Catalog\Domain reaches. #3023 moved
    #     the shared AttributeType vocabulary to Catalog Contracts and removed
    #     47 occurrences / 8 pairs; entity and repository reaches still need
    #     DTO/query/command seams rather than ruleset exceptions.
    skip_violations:
        App\Catalog\Application\DemoCatalogSeeder:
            - App\Asset\Domain\Entity\Asset
            - App\Asset\Domain\Entity\AssetVariant
        App\Catalog\Contracts\Event\ObjectCreated:
            - App\Catalog\Domain\ObjectKind
        App\Catalog\Contracts\Query\ObjectSummary:
            - App\Catalog\Domain\ObjectKind
        App\Catalog\Contracts\Query\ObjectTypeSummary:
            - App\Catalog\Domain\ObjectKind
        App\Shared\Infrastructure\Http\RequestTenantSubscriber:
            - App\Identity\Application\CurrentTenantProvider
        # RBAC-P3-002 (#665) — ProductVoter legitimately depends on
        # CatalogObject + ObjectKind because the Voter protects that
        # exact resource. Same reasoning as the existing CatalogObjectVoter
        # pattern. Phase 6 may move both enums into Catalog_Contracts;
        # this voter follows then.
        App\Identity\Infrastructure\Security\ProductVoter:
            - App\Catalog\Domain\Entity\CatalogObject
            - App\Catalog\Domain\ObjectKind
        # RBAC-P3-003 (#666) — sibling voters under Prd\, same reasoning:
        # voters legitimately reference the resource class they protect.
        App\Identity\Infrastructure\Security\Prd\CategoryVoter:
            - App\Catalog\Domain\Entity\CatalogObject
            - App\Catalog\Domain\ObjectKind
        App\Identity\Infrastructure\Security\Prd\AssetVoter:
            - App\Asset\Domain\Entity\Asset
        # #2845 — assets exist twice: the stored binary (Asset, above) and
