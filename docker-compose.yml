# PIM stack — single-origin via the `caddy` edge service. See docker/caddy/Caddyfile.
#
# `pnpm dev` (root package.json) starts the frontend through Turborepo; this stack
# brings up everything PHP / data / search / mail / auto-cert via `pnpm stack:up`.
#
# Architectural decisions:
# - FrankenPHP worker mode (Sprint 0 ticket 0.0.13 benchmark validates EntityManager::clear pattern).
# - No CORS bundle. Single-origin enforced at edge (lessons.md "Sieć / dev environment").
# - All long-lived data lives in named volumes. .docker/data/ bind mounts are kept out
#   of the synced Synology folder by the .gitignore rule.

name: pim

x-default-restart: &default_restart
  restart: unless-stopped

# HARD-02 / AUD-012 (W1-8) — dev-machine resource limits.
#
# CLAUDE.md §3.10 calls out FrankenPHP worker mode as the highest memory-leak
# risk in the stack: Doctrine Identity Map accumulates between requests and a
# missing EntityManager::clear() inside a long-running handler can OOM the
# whole worker pool. Without `deploy.resources.limits` the worker can swallow
# the entire host memory before the leak surfaces in metrics. The flush-without-
# clear pattern is now also blocked statically by App\PHPStan\Rules\
# FlushWithoutClearInLoopRule (CI gate); these container limits are the runtime
# backstop for leaks the static rule cannot see (e.g. raw DBAL/SQL bulk loads).
#
# Limits below are tuned for a 16 GB dev workstation (sum ≈ 6.5 GB across all
# services; leaves headroom for editor + browser). The `worker` service gets its
# own 512M ceiling (x-resource-limits-worker) since it is the real long-lived
# consumer. Production overrides live in docker-compose.prod.yml (worker pool at
# 512M each) and pair with the Prometheus alert on
# `frankenphp_worker_memory_bytes > 256MB` in docker/prometheus/alerts.yml,
# per CLAUDE.md §3.10.
#
# Compose Spec (v3+) supports `deploy.resources.limits` outside Swarm since
# 2022 — Docker Desktop 4.x and `docker compose` v2 both honour it.
x-resource-limits-api: &resource_limits_api
  deploy:
    resources:
      limits:
        memory: 1024M
        cpus: "2.0"

x-resource-limits-db: &resource_limits_db
  deploy:
    resources:
      limits:
        memory: 2048M
        cpus: "2.0"

x-resource-limits-search: &resource_limits_search
  deploy:
    resources:
      limits:
        memory: 1024M
        cpus: "1.0"

x-resource-limits-admin: &resource_limits_admin
  deploy:
    resources:
      limits:
        memory: 1024M
        cpus: "1.0"

x-resource-limits-cache: &resource_limits_cache
  deploy:
    resources:
      limits:
        memory: 256M
        cpus: "0.5"

# AUD-012 (W1-8) — the Messenger worker is the actual long-lived Doctrine
# consumer (the `api` container serves HTTP and recycles per worker pick). Its
# `--memory-limit=256M` flag is a SOFT recycle checked BETWEEN messages: a
# single message that leaks mid-handle (e.g. a flush without clear in a 50k-row
# import) grows past 256M and OOM-kills the host before Messenger recycles. The
# 512M container limit is the HARD ceiling that bounds one in-flight message to
# ~2× the soft limit and protects the dev workstation. Mirrors the prod worker
# limit in docker-compose.prod.yml.
x-resource-limits-worker: &resource_limits_worker
  deploy:
    resources:
      limits:
        memory: 512M
        cpus: "1.0"

x-resource-limits-storage: &resource_limits_storage
  deploy:
    resources:
      limits:
        memory: 512M
        cpus: "1.0"

x-resource-limits-edge: &resource_limits_edge
  deploy:
    resources:
      limits:
        memory: 128M
        cpus: "0.5"

x-resource-limits-tiny: &resource_limits_tiny
  deploy:
    resources:
      limits:
        memory: 128M
        cpus: "0.25"

services:
  # ─── Edge: terminates TLS + routes single-origin traffic ──────────────────
  caddy:
    image: caddy:2-alpine
    <<: [*default_restart, *resource_limits_edge]
    # #2791 — run tini as PID 1 so orphaned children get reaped.
    #
    # The healthcheck below runs BusyBox `wget` over HTTPS, and BusyBox forks a
    # helper (`ssl_client`) to do the TLS handshake. When wget exits, that
    # helper is reparented to PID 1 — which is `caddy`, a web server with no
    # reason to reap anyone else's children. Every ten seconds left one more
    # zombie behind: 8 640 a day, ~12 KB of kernel slab each, all charged to
    # this container's 128 MiB.
    #
    # Measured on the dev edge before the fix: 10 489 zombies, 121 of 128 MiB.
    # On prod: 119 MiB and `unhealthy` for 45 hours, because once the PID space
    # filled (~9 200) nothing could fork any more — so the healthcheck itself
    # could not run, and neither could `docker exec`. The container kept serving
    # traffic the whole time, which is why it went unnoticed for days.
    init: true
    depends_on:
      api:
        condition: service_healthy
      admin:
        condition: service_started
      mercure:
        condition: service_started
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    healthcheck:
      # Caddy listens on :443 only (single-origin HTTPS); the healthcheck has
      # to negotiate TLS to reach /api. Self-signed cert from the local CA is
      # accepted with --no-check-certificate.
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "--no-check-certificate", "https://localhost/api"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s

  # ─── Symfony / API Platform / FrankenPHP worker mode ──────────────────────
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
      # AUD-044 (W2-9) — the Dockerfile now has a trailing `prod` stage; without
      # an explicit target a dev `docker compose build` would build it and ship
      # APP_ENV=prod locally. Pin dev to the `base` stage. The prod overlay
      # re-targets `prod`.
      target: base
    <<: [*default_restart, *resource_limits_api]
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV:-dev}
      APP_SECRET: ${APP_SECRET:-ChangeMeBeforeDeploy}
      # AUD-002 (W1-1) — runtime connects as the NON-owner, NOBYPASSRLS role
      # `pim_app` so FORCE ROW LEVEL SECURITY is enforced on every query.
      # DATABASE_URL_OWNER (the `pim` table owner) is consumed ONLY by
      # doctrine_migrations for DDL (ENABLE/FORCE RLS, CREATE POLICY).
      DATABASE_URL: postgresql://${APP_DB_USER:-pim_app}:${APP_DB_PASSWORD:-!ChangeMe!}@database:5432/${POSTGRES_DB:-app}?serverVersion=16&charset=utf8
      DATABASE_URL_OWNER: postgresql://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-!ChangeMe!}@database:5432/${POSTGRES_DB:-app}?serverVersion=16&charset=utf8
      # Synchronous Messenger transport for local development — no worker
      # pool runs inside this stack, so async-routed messages execute
      # in-band when dispatched. Production deployments override to
      # `doctrine://default?queue_name=async` so the FrankenPHP worker
      # pool drains the queue (audit MEDIUM-007).
      MESSENGER_TRANSPORT_DSN: sync://
      MESSENGER_AGENT_TRANSPORT_DSN: sync://
      # IMP2-1.6a (#1468) — the import queue IS asynchronous in dev: the
      # `worker` service below drains it, so big files leave the request
      # path and pause/cancel (IMP2-2.3) have a real worker to act on.
      # auto_setup=0 (GOLIVE #2177) — messenger_messages is created by migration
      # Version20260704050000; pim_app has no DDL rights, so runtime auto-setup
      # on a fresh install could only fail. Keep every doctrine DSN setup-free.
      MESSENGER_IMPORT_TRANSPORT_DSN: doctrine://default?auto_setup=0
      # #2829 — dev mail goes to Mailpit (UI: https://mail.pim.localhost).
      # apps/api/.env ships MAILER_DSN=null://null, which drops every message
      # silently: invitations and password resets "send" and land nowhere, so
      # the one smoke test that matters — open the mail, click the link —
      # cannot be run. That is how the dead recovery links in #2827 survived
      # to production. Prod overrides this with a real relay and refuses to
      # start without one (docker-compose.prod.yml).
      #
      # Set MAILER_DSN in the root .env to point somewhere else — a compose
      # variable wins over apps/api/.env* because Symfony's Dotenv does not
      # overwrite real environment variables.
      MAILER_DSN: ${MAILER_DSN:-smtp://mailpit:1025}
      MAILER_FROM: ${MAILER_FROM:-noreply@pim.localhost}
      MERCURE_URL: http://mercure/.well-known/mercure
      MERCURE_PUBLIC_URL: ${MERCURE_PUBLIC_URL:-https://pim.localhost/.well-known/mercure}
      MERCURE_JWT_SECRET: ${MERCURE_JWT_SECRET:-!ChangeMercureKeyAtLeast256BitsLong!}
      MERCURE_TOPIC_BASE: ${MERCURE_TOPIC_BASE:-https://pim.localhost}
      MEILI_URL: http://meilisearch:7700
      MEILI_KEY: ${MEILI_MASTER_KEY:-masterKeyPleaseChangeMe}
      # GOLIVE #2181 (cold-start L10) — S3 credentials follow MINIO_ROOT_* like
      # minio-init and pgBackRest already do. apps/api/.env hardcodes the
      # minioadmin defaults, so changing the MinIO passwords per README used to
      # break every upload (InvalidAccessKeyId) — compose env wins over .env.
      AWS_ASSETS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      AWS_ASSETS_SECRET: ${MINIO_ROOT_PASSWORD:-minioadmin}
      # WFL-P5-01/P5-03 - tenant-editable workflow definitions (ADR-0029).
      # Default ON (#2555): configurable-approver routing. With no enabled
      # definition the provider falls back to the static YAML machine.
      WORKFLOW_CUSTOM_DEFINITIONS: ${WORKFLOW_CUSTOM_DEFINITIONS:-true}
      TRUSTED_PROXIES: 127.0.0.1,REMOTE_ADDR
      TRUSTED_HOSTS: '^pim\.localhost$$|^localhost$$|^api$$'
      # CI sentinel — propagated from GitHub Actions so docker-entrypoint.sh
      # can skip the dev seed guard (Playwright workflow drives migrations
      # itself, see apps/api/docker-entrypoint.sh).
      CI: ${CI:-}
      # Dev/test-only JWT keypair auto-generation on boot (GOLIVE cold-start
      # L4). Set ONLY here, not on the worker: both services share the
      # ./apps/api bind mount, and two containers generating concurrently on
      # first boot could interleave into a mismatched key pair. The worker
      # never encodes JWTs, so it needs no keys of its own.
      PIM_JWT_AUTOGEN: "1"
    expose:
      - "80"
    # Live-mount the source tree so iterating on PHP code does not require a
    # `docker compose build api` round-trip. var/cache and var/log are kept
    # inside the image (the bind mount excludes them via the .dockerignore +
    # Symfony env writing into the project) — anonymous named volumes shadow
    # the host paths so the worker keeps a working cache. Vendor stays in the
    # image so package upgrades go through `composer require` followed by a
    # rebuild rather than mutating the host node-style.
    volumes:
      - ./apps/api:/app
      - api_var:/app/var
      - api_vendor:/app/vendor
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1/api"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 60s

  # ─── Import queue worker (IMP2-1.6a #1468, ADR-0019 D8) ───────────────────
  # Mirrors the api container (same image, same bind mounts) but runs the
  # Messenger consumer for the dedicated `import` transport. time-limit
  # recycles the process well under the redeliver window; failure stops
  # the container and compose restarts it (crash → redelivery → resume).
  worker:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
      # AUD-044 (W2-9) — same dev `base` target as the api service.
      target: base
    <<: [*default_restart, *resource_limits_worker]
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
    # AUD-051 (W2-11) — also consume `scheduler_maintenance` so the
    # MaintenanceSchedule (export/audit/tenant/staged-file retention) actually
    # fires its daily cron; without a consumer the schedule is inert.
    # APIC-P3-09 — `scheduler_integration_sync` drains the SyncSchedule per-minute
    # tick that fires due sync bindings (integration:sync:dispatch-due).
    # #2597 follow-up — the worker runs APP_DEBUG=0, so Symfony does NOT rebuild
    # the compiled container when source changes. After a pull that touches DI
    # wiring (e.g. a new constructor arg) the stale container instantiates
    # services with the old signature and every message dead-letters with a
    # TypeError. A boot-time cache:clear rebuilds the container so a restart
    # always picks up the new code; it clears only APP_CACHE_DIR
    # (/app/var/cache-worker), never the api's tree, so it cannot corrupt live
    # requests (the reason the old boot clear was removed — GOLIVE #2179).
    # `async` pierwszy — bez niego transport ma DSN, ale nie ma konsumenta,
    # a wiadomości (m.in. miniatury multimediów) zalegają zamiast się wykonać.
    # Ten sam brak wywrócił miniatury na instancjach tenantów (#2944).
    command: sh -c "php bin/console cache:clear --no-warmup && php bin/console messenger:consume async import scheduler_maintenance scheduler_integration_sync --time-limit=3600 --memory-limit=256M"
    environment:
      APP_ENV: ${APP_ENV:-dev}
      # WFL-P5-01 - the bulk change_status handler resolves the workflow
      # through the same provider as the request path; keep both sides of
      # the stack on one flag value (default ON, #2555).
      WORKFLOW_CUSTOM_DEFINITIONS: ${WORKFLOW_CUSTOM_DEFINITIONS:-true}
      # The worker is a headless background consumer (import/export/reindex) —
      # it never serves the web profiler. APP_DEBUG=1 (the dev default) makes
      # Symfony's debug caches (DoctrineBundle DebugDataHolder, the profiler's
      # ArrayAdapter pools, the SQL logger) accumulate one in-memory entry per
      # query for the whole run, so a large bulk job (50k-SKU import / full
      # catalog export) climbs to the 256 MiB ceiling and SIGKILLs — a dev-only
      # artifact the prod worker (APP_DEBUG=0) never pays. Pin it off here so
      # local bulk runs profile like prod (flat O(chunk) memory).
      APP_DEBUG: "0"
      # GOLIVE #2179 — role-scoped cache dir (see src/Kernel.php::getCacheDir).
      # The worker's boot-time cache:clear used to wipe the api's DEBUG
      # container from the shared var/cache/dev, corrupting live requests
      # (HTTP 200 + HTML fatal). Own tree = each role clears only itself.
      APP_CACHE_DIR: /app/var/cache-worker
      # #2829 — dev mail goes to Mailpit (UI: https://mail.pim.localhost).
      # apps/api/.env ships MAILER_DSN=null://null, which drops every message
      # silently: invitations and password resets "send" and land nowhere, so
      # the one smoke test that matters — open the mail, click the link —
      # cannot be run. That is how the dead recovery links in #2827 survived
      # to production. Prod overrides this with a real relay and refuses to
      # start without one (docker-compose.prod.yml).
      #
      # Set MAILER_DSN in the root .env to point somewhere else — a compose
      # variable wins over apps/api/.env* because Symfony's Dotenv does not
      # overwrite real environment variables.
      MAILER_DSN: ${MAILER_DSN:-smtp://mailpit:1025}
      MAILER_FROM: ${MAILER_FROM:-noreply@pim.localhost}
      APP_SECRET: ${APP_SECRET:-ChangeMeBeforeDeploy}
      # AUD-002 (W1-1) — same NON-owner, NOBYPASSRLS runtime role as the api.
      # The worker sets app.current_tenant at session scope via
      # TenantRlsGucMiddleware, so FORCE RLS is enforced on async writes too.
      DATABASE_URL: postgresql://${APP_DB_USER:-pim_app}:${APP_DB_PASSWORD:-!ChangeMe!}@database:5432/${POSTGRES_DB:-app}?serverVersion=16&charset=utf8
      DATABASE_URL_OWNER: postgresql://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-!ChangeMe!}@database:5432/${POSTGRES_DB:-app}?serverVersion=16&charset=utf8
      MESSENGER_TRANSPORT_DSN: sync://
      MESSENGER_AGENT_TRANSPORT_DSN: sync://
      # auto_setup=0 (GOLIVE #2177) — messenger_messages is created by migration
      # Version20260704050000; pim_app has no DDL rights, so runtime auto-setup
      # on a fresh install could only fail. Keep every doctrine DSN setup-free.
      MESSENGER_IMPORT_TRANSPORT_DSN: doctrine://default?auto_setup=0
      MERCURE_URL: http://mercure/.well-known/mercure
      MERCURE_PUBLIC_URL: ${MERCURE_PUBLIC_URL:-https://pim.localhost/.well-known/mercure}
      MERCURE_JWT_SECRET: ${MERCURE_JWT_SECRET:-!ChangeMercureKeyAtLeast256BitsLong!}
      MERCURE_TOPIC_BASE: ${MERCURE_TOPIC_BASE:-https://pim.localhost}
      MEILI_URL: http://meilisearch:7700
      MEILI_KEY: ${MEILI_MASTER_KEY:-masterKeyPleaseChangeMe}
      # GOLIVE #2181 (cold-start L10) — S3 credentials follow MINIO_ROOT_* like
      # minio-init and pgBackRest already do. apps/api/.env hardcodes the
      # minioadmin defaults, so changing the MinIO passwords per README used to
      # break every upload (InvalidAccessKeyId) — compose env wins over .env.
      AWS_ASSETS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      AWS_ASSETS_SECRET: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - ./apps/api:/app
      - api_var:/app/var
      - api_vendor:/app/vendor
    # AUD-036 (W2-12) — the worker is a CLI Messenger consumer, NOT an HTTP
    # service, so the api image's inherited `curl http://127.0.0.1/api` probe
    # could never succeed (nothing listens on :80 here) and the container sat
    # permanently `unhealthy` (FailingStreak ever-growing) — masking a real
    # crash and leaving any `depends_on: service_healthy` on the worker unmet.
    # Probe the consumer process instead: `pgrep` ships in the base image
    # (/usr/bin/pgrep); a non-zero exit (no matching process) marks unhealthy
    # so a genuinely dead consumer surfaces honestly.
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'messenger:consume' > /dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # ─── Frontend admin (Vite dev server) ─────────────────────────────────────
  admin:
    image: node:22-alpine
    <<: [*default_restart, *resource_limits_admin]
    working_dir: /workspace/apps/admin
    command: sh -c "corepack enable && corepack prepare pnpm@10.33.2 --activate && pnpm install --frozen-lockfile=false && pnpm dev"
    environment:
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ./:/workspace
      - admin_node_modules:/workspace/node_modules
      - admin_app_node_modules:/workspace/apps/admin/node_modules
    expose:
      - "5173"

  # ─── PostgreSQL 16 + pgBackRest (Sprint 0 stub, ticket #15) ───────────────
  # Custom image bakes pgbackrest + dcron into postgres:16-alpine so:
  #   - archive_command pushes WAL straight to MinIO (continuous archiving)
  #   - the hourly cron entry runs `pgbackrest backup --stanza=pim`
  #   - the initial stanza-create + full backup run in the background once
  #     postgres is ready (pim-init-backup.sh, fired from start-pim.sh)
  # Production schedule (weekly full + daily diff + 5-min WAL + automated weekly
  # restore test) lands in 0.11.11 — see docs/runbook/restore.md.
  database:
    build:
      context: ./docker/postgres
      dockerfile: Dockerfile
    image: pim-database:local
    <<: [*default_restart, *resource_limits_db]
    depends_on:
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      minio-tls:
        condition: service_started
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-app}
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-!ChangeMe!}
      # AUD-002 (W1-1) — the database image's pim-init-app-role.sh reads these
      # to idempotently CREATE/ALTER the runtime role `pim_app` (LOGIN,
      # NOSUPERUSER, NOBYPASSRLS) and keep its password in sync on every start,
      # so the role + password exist before the api connects — on a fresh volume
      # AND on a pre-existing one (initdb scripts only run on first init).
      APP_DB_USER: ${APP_DB_USER:-pim_app}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:-!ChangeMe!}
      PGBACKREST_STANZA: pim
      PGBACKREST_REPO1_S3_KEY: ${MINIO_ROOT_USER:-minioadmin}
      PGBACKREST_REPO1_S3_KEY_SECRET: ${MINIO_ROOT_PASSWORD:-minioadmin}
    # archive_mode + archive_command are server-level GUCs that have to be
    # passed at every postgres start. Putting them on the command line keeps
    # them visible here instead of hidden inside the data directory's
    # postgresql.auto.conf. wal_level=replica is the minimum required for
    # archiving + future replication; max_wal_senders > 0 keeps the door open
    # for pg_basebackup-style probes from pgBackRest.
    command:
      - "postgres"
      - "-c"
      - "archive_mode=on"
      - "-c"
      - "archive_command=pgbackrest --stanza=pim archive-push %p"
      - "-c"
      - "wal_level=replica"
      - "-c"
      - "max_wal_senders=3"
      - "-c"
      - "archive_timeout=60"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-d", "${POSTGRES_DB:-app}", "-U", "${POSTGRES_USER:-app}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 30s

  # ─── Redis 7 (Symfony Messenger transport + cache) ────────────────────────
  redis:
    image: redis:7-alpine
    <<: [*default_restart, *resource_limits_cache]
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ─── Meilisearch (search) ─────────────────────────────────────────────────
  meilisearch:
    image: getmeili/meilisearch:v1.13
    <<: [*default_restart, *resource_limits_search]
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-masterKeyPleaseChangeMe}
      MEILI_NO_ANALYTICS: "true"
      MEILI_ENV: development
    volumes:
      - meilisearch_data:/meili_data
    expose:
      - "7700"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:7700/health"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ─── MinIO (S3-compatible object storage for assets, backups) ─────────────
  minio:
    image: minio/minio:latest
    <<: [*default_restart, *resource_limits_storage]
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio_data:/data
    expose:
      - "9000"
      - "9001"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/minio/health/live"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ─── MinIO TLS terminator (pgBackRest → MinIO) ────────────────────────────
  # pgBackRest 2.57 hard-codes HTTPS for S3 repos. This Caddy sidecar adds TLS
  # in front of MinIO so the database container can use a single S3 endpoint
  # without bringing TLS into the main MinIO config. See docs/runbook/restore.md
  # and docker/caddy/Caddyfile.minio.
  minio-tls:
    image: caddy:2-alpine
    <<: [*default_restart, *resource_limits_tiny]
    depends_on:
      minio:
        condition: service_healthy
    volumes:
      - ./docker/caddy/Caddyfile.minio:/etc/caddy/Caddyfile:ro
      - minio_tls_data:/data
      - minio_tls_config:/config
    expose:
      - "443"

  # Initialise required buckets the first time the stack comes up.
  # AUD-028 (#1576): pim-assets is explicitly set to `none` — never a public
  # `download` policy. Asset bytes are served only through the signature-gated
  # `/api/assets/{id}/preview` endpoint (AUD-006); the bucket must not be
  # anonymously readable even if MinIO is ever published. `set none` also
  # remediates a stack initialised before this change.
  #
  # AUD-018 (W1-6): bucket versioning + repo separation against the backup SPOF.
  #   - `mc version enable` on the durable buckets (assets, the pgBackRest repo
  #     bucket, exports) so an accidental/malicious `mc rm` or overwrite leaves
  #     the previous object version recoverable (`mc cp --version-id`). This is
  #     the only line of defence for assets, which — unlike Postgres — have no
  #     other backup. Idempotent: `version enable` on an already-versioned
  #     bucket is a no-op, so it also upgrades a stack created before this change.
  #   - `pim-pgbackrest` is a DEDICATED bucket for the database backup repo,
  #     separate from `pim-assets`. In dev this is bucket-level separation on the
  #     same MinIO; true anti-SPOF (separate instance / region) is configured in
  #     the prod overlay — see docker-compose.prod.yml minio-init + the MinIO DR
  #     section of docs/runbook/disaster-recovery.md. The legacy `pim-backups`
  #     bucket is left in place (existing 2026-04-28 repo objects are NOT
  #     destroyed); the stanza re-creates in the new isolated bucket.
  #   - pim-imports stays un-versioned on purpose: transient ingest payloads with
  #     a 7-day expiry — versioning would only pile up delete-markers.
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-minioadmin};
      mc mb -p local/pim-assets || true;
      mc mb -p local/pim-backups || true;
      mc mb -p local/pim-pgbackrest || true;
      mc mb -p local/pim-imports || true;
      mc mb -p local/pim-exports || true;
      mc anonymous set none local/pim-assets || true;
      mc version enable local/pim-assets || true;
      mc version enable local/pim-pgbackrest || true;
      mc version enable local/pim-exports || true;
      mc ilm rule add --expire-days 7 local/pim-imports || true;
      "
    restart: "no"

  # ─── Mercure (SSE hub) ────────────────────────────────────────────────────
  mercure:
    image: dunglas/mercure:latest
    <<: [*default_restart, *resource_limits_edge]
    environment:
      SERVER_NAME: ":80"
      MERCURE_PUBLISHER_JWT_KEY: ${MERCURE_JWT_SECRET:-!ChangeMercureKeyAtLeast256BitsLong!}
      MERCURE_SUBSCRIBER_JWT_KEY: ${MERCURE_JWT_SECRET:-!ChangeMercureKeyAtLeast256BitsLong!}
      # AUD-001 (#1573) — NO `anonymous` directive: every subscription must
      # present a `mercureAuthorization` cookie (minted by
      # POST /api/mercure/authorization, scoped to the caller's tenant
      # topics). Without it the hub answers 401. Re-adding `anonymous`
      # re-opens the cross-tenant SSE leak.
      MERCURE_EXTRA_DIRECTIVES: |
        cors_origins ${MERCURE_CORS_ORIGINS:-https://pim.localhost https://localhost}
    expose:
      - "80"
    volumes:
      - mercure_data:/data
      - mercure_config:/config

  # ─── k6 (HTTP load tester) — perf profile only ────────────────────────────
  # Activated explicitly with `--profile perf` and never starts as part of
  # `pnpm stack:up`. The wrapper at scripts/perf-list-products.sh orchestrates
  # the login + seed + k6 + cleanup flow used by ticket 0.0.14 (load test
  # /api/products?page=1, p95 < 200 ms target). network_mode: service:caddy
  # gives k6 the same DNS view as the edge so https://pim.localhost works
  # against the same self-signed cert the rest of the stack uses.
  k6:
    image: grafana/k6:latest
    profiles: ["perf"]
    network_mode: "service:caddy"
    volumes:
      - ./tools/perf:/scripts:ro
      # GOLIVE #2124 — load-session scenarios + writable summary exports.
      - ./scripts/load:/load
    entrypoint: ["k6"]

  # ─── Gotenberg (PDF renderer sidecar) — gotenberg profile only ────────────
  # Optional high-fidelity Chromium renderer for PDF catalogs (ADR-0027,
  # CPDF-P6-03). Never starts by default: activate with
  # `docker compose --profile gotenberg up -d gotenberg` and point the API at
  # it via CATALOG_PDF_RENDERER=gotenberg + GOTENBERG_URL=http://gotenberg:3000
  # (both read at container start; unset ⇒ the in-process Dompdf default).
  gotenberg:
    image: gotenberg/gotenberg:8
    # Worker-class limits: each Chromium render peaks at ~85-200 MB (plan §4).
    <<: [*default_restart, *resource_limits_worker]
    profiles: ["gotenberg"]
    expose:
      - "3000"

  # ─── Mailpit (dev mail catcher) ───────────────────────────────────────────
  mailpit:
    image: axllent/mailpit:latest
    <<: [*default_restart, *resource_limits_tiny]
    environment:
      MP_MAX_MESSAGES: 5000
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    expose:
      - "1025"
      - "8025"

volumes:
  caddy_data:
  caddy_config:
  postgres_data:
  redis_data:
  meilisearch_data:
  minio_data:
  minio_tls_data:
  minio_tls_config:
  mercure_data:
  mercure_config:
  admin_node_modules:
  admin_app_node_modules:
  api_var:
  api_vendor:
