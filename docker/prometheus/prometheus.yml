# Prometheus scrape + alert config for the prod stack.
#
# PROD-04 — surfaces the FrankenPHP worker-memory ceiling that
# CLAUDE.md §3.10 flags as the highest-risk class of regression
# (Doctrine Identity Map drift inside a long-running worker → OOM).
# Companion alert rules live in alerts.yml.

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    stack: pim
    env: prod

rule_files:
  - "/etc/prometheus/alerts.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - "alertmanager:9093"

scrape_configs:
  - job_name: "pim-api"
    metrics_path: /api/metrics
    # Scraping the public Caddy hostname produces a fresh worker pick per
    # scrape (random LB across the worker pool). The rolling-max alert
    # rule in alerts.yml makes that randomness acceptable.
    scheme: http
    static_configs:
      - targets: ["api:80"]
        labels:
          service: api
          # The MetricsController also exposes db_query_duration_seconds —
          # the same job covers both. Per-target relabeling is overkill at
          # the single-API-service scale.
          tier: web

  # ─── Dependency availability (#2222) ──────────────────────────────────
  #
  # Chaos dry-run #2137: a Meili/MinIO/Redis/Mercure outage degraded the
  # API gracefully but fired NO alert — none of those services were
  # scraped. One blackbox exporter probes each dependency's keyless
  # health surface (modules in blackbox.yml); `probe_success == 0` drives
  # the pim-dependencies alert group. The `dependency` label carries a
  # stable human name so alert annotations don't parse URLs.
  - job_name: "dependencies-http"
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets: ["http://meilisearch:7700/health"]
        labels: { dependency: meilisearch, tier: data }
      - targets: ["http://minio:9000/minio/health/live"]
        labels: { dependency: minio, tier: data }
      - targets: ["http://mercure/healthz"]
        labels: { dependency: mercure, tier: web }
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: "blackbox:9115"

  - job_name: "dependencies-tcp"
    metrics_path: /probe
    params:
      module: [tcp_connect]
    static_configs:
      - targets: ["redis:6379"]
        labels: { dependency: redis, tier: data }
      - targets: ["database:5432"]
        labels: { dependency: postgres, tier: data }
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: "blackbox:9115"

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
