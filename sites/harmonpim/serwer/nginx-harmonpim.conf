# ═══════════════════════════════════════════════════════════════════════════
# ⚠ NIEUŻYWANY — plik referencyjny. Wdrożenie produkcyjne (2026-08-06) stoi na
#   Caddy/FrankenPHP, nie na nginx: patrz serwer/Caddyfile + serwer/docker-compose.yml.
#   Powód: aplikacja PIM (app.harmonpim.pl) stoi na Caddy i dzieli ten sam host,
#   a dwa serwery WWW nie mogą jednocześnie trzymać portów 80/443. FrankenPHP
#   daje przy okazji PHP dla mail.php bez osobnego php-fpm.
#   Ten config zostaje jako czytelna specyfikacja reguł (ładne adresy,
#   404, cache, blokada obcych .php) — Caddyfile odwzorowuje go 1:1.
# ═══════════════════════════════════════════════════════════════════════════
# Harmon PIM — nginx: strona marketingowa harmonpim.pl (statyczna + mail.php)
#
# Instalacja:  /etc/nginx/sites-available/harmonpim.conf
#              ln -s ../sites-available/harmonpim.conf /etc/nginx/sites-enabled/
#              nginx -t && systemctl reload nginx
# HTTPS:       certbot --nginx -d harmonpim.pl -d www.harmonpim.pl
#              (certbot sam dopisze bloki ssl i przekierowanie z http)
# Pliki strony: /var/www/harmonpim  (zawartość katalogu dist/)
# ═══════════════════════════════════════════════════════════════════════════

# www → bez www
server {
    listen 80;
    listen [::]:80;
    server_name www.harmonpim.pl;
    return 301 http://harmonpim.pl$request_uri;   # po certbocie zmień na https://
}

server {
    listen 80;
    listen [::]:80;
    server_name harmonpim.pl;

    root /var/www/harmonpim;
    index index.html;

    # ładne adresy: /produkt/ → /produkt/index.html, brak → strona 404
    location / {
        try_files $uri $uri/ =404;
    }
    error_page 404 /404.html;

    # formularze — jedyny plik PHP na stronie
    location = /mail.php {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        # dopasuj do wersji PHP na serwerze (php-fpm -v):
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    }
    # żaden inny plik .php nie jest wykonywany ani serwowany
    location ~ \.php$ { return 404; }

    # cache: assety z długim TTL, HTML zawsze świeży
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }
    location ~ \.(webp|png|svg|woff2)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }
    location ~ \.html$ {
        add_header Cache-Control "no-cache";
    }

    # kompresja
    gzip on;
    gzip_types text/html text/css application/javascript application/json image/svg+xml application/xml text/plain;
    gzip_min_length 512;

    # bezpieczeństwo
    add_header X-Content-Type-Options "nosniff" always;
    location ~ /\.(?!well-known) { deny all; }   # .htaccess, .git itp.
}

